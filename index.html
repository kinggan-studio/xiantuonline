}

// ---------- 入道：选宗门 + 刷灵根 ----------

// 自动开关栏：探索页和战斗页都放在整屏的最底部，位置固定
function autoBar(app, a, { trial = false } = {}) {
  return h('div', { class: 'auto-bar', role: 'group', 'aria-label': '自动开关' },
    h('button', { class: `seal small grow-btn ${app.auto ? 'on' : ''}`, 'aria-pressed': String(app.auto), onclick: a.toggleAuto }, app.auto ? '自动战斗：开' : '自动战斗：关'),
    h('button', { class: `seal small grow-btn ${app.autoExplore ? 'on' : ''}`, disabled: trial, 'aria-pressed': String(app.autoExplore), onclick: a.toggleAutoExplore }, app.autoExplore ? '自动历练：开' : '自动历练：关'));
}

// 自动吃药：生命低于这个比例时自动吃回春丹，放在丹药旁边
function pillAuto(app, a) {
  return h('label', { class: 'pill-auto', title: '生命低于这个比例时，自动吃回春丹' }, '自动吃药',
    h('select', { 'aria-label': '自动吃回春丹的生命阈值', onchange: (ev) => a.setPillThreshold(Number(ev.target.value)) },
      [[0, '关'], [0.3, '<30%'], [0.5, '<50%']].map(([v, t]) => h('option', { value: String(v), selected: app.autoConfig.pillHpThreshold === v }, t))));
}

function renderSelect(app, a) {
  const { sectId, root, rerolls } = app.selection;
  const sect = sectId ? SECTS[sectId] : null;
  const rootData = ROOTS[root.rootId];
  const synergy = sect
    ? sect.starterSkills.filter((id) => SKILLS[id].element === rootData.element).map((id) => SKILLS[id].name)
    : [];
  const followers = sect
    ? sect.starterSkills.filter((id) => SKILLS[id].element === 'self' && SKILLS[id].power > 0).map((id) => SKILLS[id].name)
    : [];
  const synergyHint = synergy.length
    ? h('p', { class: 'synergy' }, `同源：「${synergy.join('」「')}」威力 +20%`)
    : sect
      ? h('p', { class: 'muted' }, followers.length
        ? `「${followers.join('」「')}」的属性跟随你的灵根，这个灵根暂无同源加成`
        : '这个灵根与该宗门武学不同源，换一个更合适')
      : h('p', { class: 'muted' }, '选好宗门后，这里会提示同源武学');
  const meta = app.save.meta;
  return h('section', { class: 'screen' },
    topbar(a),
    h('div', { class: 'dao-strip' },
      h('span', { class: 'row tight' },
        (meta.cycle || 1) > 1 ? h('button', { class: 'seal small step', 'aria-label': '降低周目', disabled: (app.selection.cycle || 1) <= 1, onclick: () => a.pickCycle(-1) }, '◀') : null,
        h('b', null, `第 ${app.selection.cycle || 1} 周目`),
        (meta.cycle || 1) > 1 ? h('button', { class: 'seal small step', 'aria-label': '提高周目', disabled: (app.selection.cycle || 1) >= (meta.cycle || 1), onclick: () => a.pickCycle(1) }, '▶') : null,
        h('span', null, ` 道果 ${meta.dao || 0}`)),
      h('button', { class: 'seal small', onclick: a.openDao }, '道果加持')),
    h('div', { class: 'panel' },
      h('h2', null, '宗门'),
      h('div', { class: 'grid3' }, Object.values(SECTS).map((s) =>
        h('button', { class: 'card', 'aria-pressed': String(sectId === s.id), onclick: () => a.pickSect(s.id) },
          h('span', { class: 'ico', 'aria-hidden': 'true' }, s.icon), s.name))),
      h('p', { class: 'detail', style: 'margin-top:6px' },
        sect
          ? [h('b', null, sect.name), `：${sect.desc} 擅长${TAGS[sect.affinity]}。`, h('b', null, ` 独门·${sect.passive.name}`), `：${sect.passive.desc}`]
          : '点选一个宗门，查看它擅长的武学类型和独门机制。'),
    ),
    h('div', { class: 'panel' },
      h('div', { class: 'row spread' },
        h('h2', { style: 'margin:0' }, '灵根'),
        h('button', { class: 'seal small', onclick: a.reroll }, '🎲 刷新灵根')),
      h('div', { style: 'margin:6px 0 2px' }, rootLabel(root.rootId, root.quality), ' ', h('span', { class: 'tag' }, `${rootData.element}属性`)),
      h('p', { class: 'muted' }, describeRoot(rootData, root.quality) || '无属性加成'),
      synergyHint,
      h('p', { class: 'muted', style: 'margin-top:2px' }, `品质：杂 < 普 < 优 < 天。已刷新 ${rerolls} 次，可无限刷新。`),
    ),
    app.notice ? h('p', { class: 'notice', role: 'status' }, app.notice) : null,
    h('div', { class: 'grow' }),
    h('p', { class: 'tip warn', role: 'note' }, h('b', null, '⚠️ 无痕/隐私模式下，关闭页面进度会消失！'), ' 建议「添加到主屏幕」游玩，换设备前请在「☰ 菜单」导出存档码。'),
    h('button', { class: 'seal primary block', disabled: !sectId, onclick: a.begin }, sectId ? '入道' : '请先选择宗门'),
  );
}

// ---------- 探索 ----------
function renderExplore(app, a) {
  const run = app.save.run;
  const p = run.player;
  const sect = SECTS[p.sectId];
  const band = bandAt(run.depth);
  const gate = atGate(run); // 站在区域尽头：要击败首领才能继续
  return h('section', { class: 'screen' },
    topbar(a, { bag: true }),
    h('div', { class: 'panel' },
      h('div', { class: 'row spread' },
        h('div', { class: 'status-title' }, `${sect.icon} ${sect.name} · `, rootLabel(p.rootId, p.rootQuality || 'pu')),
        h('span', { class: 'tag realm' }, realmName(p.realm, p.stage))),
      h('div', { class: 'row spread', style: 'margin:2px 0 4px' },
        h('p', { class: 'muted' }, `${(run.cycle || 1) > 1 ? `第 ${run.cycle} 周目 · ` : ''}${band.name} · 第 ${fmt(run.depth)} 层 · 已斩 ${fmt(run.kills)} 只`),
        goldBadge(p, true)),
      meter('生命', p.hp, p.stats.maxHp, 'hp'),
      meter('灵力', p.mp, p.stats.maxMp, 'mp'),
      h('div', { class: 'muted' }, `攻 ${fmt(p.stats.atk)} · 防 ${fmt(p.stats.def)} · 身法 ${p.stats.spd} · 暴击 ${Math.round(p.stats.crit * 1000) / 10}%`),
      statusTags(p).length ? h('div', { class: 'row tight' }, statusTags(p)) : null,
    ),
    h('div', { class: 'panel' },
      h('div', { class: 'row tight' },
        h('b', null, '武学'),
        p.skills.length
          ? p.skills.map((id) => h('span', { class: 'tag' }, `${SKILLS[id].name}${levelOf(p, id) > 1 ? ` Lv.${levelOf(p, id)}` : ''} ${skillCost(p, SKILLS[id])}`))
          : h('span', { class: 'muted' }, '未装备，点 🎒 装备')),
      h('div', { class: 'muted', style: 'margin-top:4px' }, `擅长${TAGS[sect.affinity]} · 独门「${sect.passive.name}」（详情见 🎒 宗门）`),
    ),
    h('div', { class: 'row pill-row' },
      h('span', { class: 'muted' }, '丹药'),
      Object.entries(p.items).map(([id, n]) =>
        h('button', { class: 'seal small', disabled: n <= 0, title: ITEMS[id].desc, 'aria-label': `${ITEMS[id].name}，${ITEMS[id].desc}，剩 ${n} 颗`, onclick: () => a.useItemOutside(id) }, `${ITEMS[id].name} ×${n}`)),
      pillAuto(app, a)),
    app.notice ? h('p', { class: 'notice', role: 'status' }, rich(app.notice)) : null,
    h('div', { class: 'log', role: 'log', 'aria-live': 'polite', 'aria-label': '历练记录' },
      (run.journal || []).length
        ? run.journal.map((l) => h('div', { class: `ln ${l.kind || ''} ${l.crit ? 'crit' : ''}` }, rich(l.text)))
        : h('div', { class: 'ln info' }, '还没有历练记录，点「历练」出发。')),
    (p.keys > 0 || (run.demon && run.demon.inside)) ? h('button', { class: 'seal small block', onclick: a.openDemon }, `🗝 魔界 ×${p.keys || 0}`) : null,
    gate
      ? h('button', { class: 'seal primary block', onclick: a.breakthrough }, `突破 ${REALMS[p.realm]} → ${REALMS[p.realm + 1]}（挑战${BOSS.names[p.realm]}）`)
      : h('button', { class: 'seal primary block', onclick: a.explore }, '历练'),
    autoBar(app, a),
  );
}

// ---------- 行商 ----------
function renderShop(app, a) {
  const run = app.save.run;
  const p = run.player;
  const shop = run.shop;
  const entryInfo = (e) => {
    if (e.kind === 'equip') return { name: h('span', null, itemName(e.item), ' ', compareTag(p, e.item)), desc: equipLine(e.item) };
    if (e.kind === 'skill') {
      const s = SKILLS[e.id];
      const lv = p.learned.includes(e.id) ? levelOf(p, e.id) : 0;
      const tip = lv === 0 ? '新武学' : lv >= SKILL_MAX_LEVEL ? `已满级 Lv.${lv}` : `已学 Lv.${lv}`;
      return { name: h('span', null, `📜 《${s.name}》秘籍`), desc: `${tip}，买回去自己决定学习还是卖｜${skillLine(p, s)}` };
    }
    return { name: h('span', null, `💊 ${ITEMS[e.id].name}`, !e.sold ? ` （余 ${e.stock}）` : ''), desc: `药品｜${ITEMS[e.id].desc}` };
  };
  const selling = app.shopTab === 'sell';
  const tabs = h('div', { class: 'tabs', role: 'tablist' },
    [['buy', '购买'], ['sell', '出售']].map(([id, name]) =>
      h('button', { class: 'tab', role: 'tab', 'aria-selected': String(app.shopTab === id), onclick: () => a.setShopTab(id) }, name)));
  const buyList = h('div', { class: 'shop grow' }, shop.map((e, i) => {
    const info = entryInfo(e);
    const maxed = e.kind === 'skill' && p.learned.includes(e.id) && levelOf(p, e.id) >= SKILL_MAX_LEVEL;
    return h('div', { class: `item-row ${e.sold ? 'sold' : ''}${e.kind === 'equip' ? ` rar-${e.item.rarity}` : ''}` },
      h('div', { class: 'item-info' }, h('b', null, info.name), h('div', { class: 'muted' }, info.desc)),
      h('button', {
        class: 'seal small', disabled: e.sold || maxed || p.gold < e.price,
        'aria-label': `购买${shopEntryName(e)}，${e.price} 元宝`, onclick: () => a.buy(i),
      }, e.sold ? '已售' : maxed ? '满级' : price(e.price)));

  const gear = [...p.bag.equipment].sort(byRarity);
  const pickCount = gear.filter((e) => app.sellPick.includes(e.rarity)).length;
  const pickGold = gear.filter((e) => app.sellPick.includes(e.rarity)).reduce((sum, e) => sum + equipSellPrice(e), 0);

    h('button', { class: 'seal small', onclick, 'aria-label': label }, '卖 ', price(amount)));
  const sellList = h('div', { class: 'shop grow' },

    h('div', { class: 'bulk-sell' },
      h('div', { class: 'muted' }, '一键出售：勾选要卖的品质'),
      h('div', { class: 'row tight' }, RARITIES.map((r) => {
        const n = gear.filter((e) => e.rarity === r).length;
        const on = app.sellPick.includes(r);
        return h('button', {
          class: `chip r-${r}${on ? ' on' : ''}`, 'aria-pressed': String(on), disabled: !n && !on,

    books.length ? h('h3', null, '武学秘籍') : null,
    books.map(([id, n]) => sellRow(`📜 《${SKILLS[id].name}》秘籍 ×${n}`, p.learned.includes(id) ? `已学 Lv.${levelOf(p, id)}` : '未学会', bookSellPrice(p, id), () => a.sell('book', id), `卖出${SKILLS[id].name}秘籍`)),
    p.learned.length > 1 ? h('h3', null, '已学武学（卖掉等于遗忘）') : null,
    p.learned.length > 1 ? p.learned.map((id) => sellRow(`${SKILLS[id].name} Lv.${levelOf(p, id)}`, p.skills.includes(id) ? '已装备' : '未装备', skillSellPrice(p, id), () => a.sell('skill', id), `遗忘并卖出${SKILLS[id].name}`)) : null,
    Object.entries(p.items).some(([, n]) => n > 0) ? h('h3', null, '丹药') : null,
    Object.entries(p.items).filter(([, n]) => n > 0).map(([id, n]) => sellRow(`💊 ${ITEMS[id].name} ×${n}`, ITEMS[id].desc, sellPrice(pillPrice(ITEMS[id], p.realm || 0)), () => a.sell('pill', id), `卖出${ITEMS[id].name}`)),
    !gear.length && !books.length && p.learned.length <= 1 && !Object.values(p.items).some((n) => n > 0) ? h('p', { class: 'muted' }, '你身上没有可卖的东西。') : null);

    h('header', { class: 'topbar' },
      h('h1', { class: 'brand' }, '行商'),
      goldBadge(p, true)),
    tabs,
    selling ? sellList : buyList,
    app.shopMsg ? h('p', { class: 'notice', role: 'status' }, rich(app.shopMsg)) : null,
    h('button', { class: 'seal primary block', onclick: a.leaveShop }, '告辞'),
  );
}

// ---------- 战斗 ----------
function renderBattle(app, a) {
  const b = app.battle;
  const { player: p, enemy: e } = b;
  const acts = listActions(p);
  const manualLocked = app.auto || b.over;
  const skillActs = acts.filter((x) => x.type === 'skill');
  const itemActs = acts.filter((x) => x.type === 'item');
  return h('section', { class: 'screen' },
    h('div', { class: `panel enemy-row${e.isBoss || e.isFinal ? ' boss' : e.isTrial ? ' trial' : ''}` },
      h('div', { class: `face${portraitSrc(e) ? ` art${portraitFull(e) ? ' full' : ''}` : ''}${app.flash && app.flash.enemy ? ' hit' : ''}`, 'aria-hidden': 'true' },
        portraitSrc(e) ? h('img', { src: portraitSrc(e), alt: '', draggable: 'false' }) : e.icon),
      h('div', null,
        h('div', { class: 'ename' }, e.name, ' ', h('span', { class: 'tag' }, `${e.element}属性`), e.human ? h('span', { class: 'tag bad' }, '魔修') : null, e.isBoss ? h('span', { class: 'tag bad' }, '瓶颈首领') : null, b.rule ? h('span', { class: 'tag bad', title: RULE_INFO[b.rule].desc }, RULE_INFO[b.rule].name) : null),
        b.rule === 'fear' ? h('div', { class: 'muted' }, '生命：？？？（被恐惧遮蔽了）') : meter('生命', e.hp, e.stats.maxHp, 'hp'),
        statusTags(e).length ? h('div', { class: 'row tight' }, statusTags(e)) : null)),
    h('div', { class: 'log', role: 'log', 'aria-live': 'polite', 'aria-label': '战斗日志' },
      b.log.slice(-60).map((l) => h('div', { class: `ln ${l.kind || ''} ${l.crit ? 'crit' : ''}` }, l.text))),
    h('div', { class: `panel${app.flash && app.flash.player ? ' hurt' : ''}` },
      h('div', { class: 'row spread' },
        h('strong', null, `${p.icon} ${p.name} `, h('span', { class: 'tag realm' }, realmName(p.realm, p.stage))),
        h('span', { class: 'row tight' }, goldBadge(p), h('span', { class: 'tag' }, `第 ${b.turn} 回合`))),
      meter('生命', p.hp, p.stats.maxHp, 'hp'),
      meter('灵力', p.mp, p.stats.maxMp, 'mp'),
      statusTags(p).length ? h('div', { class: 'row tight' }, statusTags(p)) : null),
    b.over
      ? h('div', { class: 'panel stack' },
        h('h2', null, b.winner === 'player' ? '胜利' : b.enemy.isTrial ? '挑战失败' : '身死道消'),
        a.resultText() ? h('p', { class: 'muted' }, rich(a.resultText())) : null,
        h('button', { class: 'seal primary block', onclick: a.finish }, b.winner === 'player' ? (b.enemy.isTrial ? (b.enemy.isFinal ? '查看结局' : '返回魔界') : '继续历练') : b.enemy.isTrial ? '离开魔界' : '重入轮回'))
      : [
        h('div', { class: 'actions' },
          h('button', { class: 'seal', disabled: manualLocked, onclick: () => a.act({ type: 'attack' }) }, '普攻'),
          skillActs.map((s) => h('button', {
            class: 'seal', disabled: manualLocked || !s.affordable, title: SKILLS[s.skillId].desc,
            onclick: () => a.act({ type: 'skill', skillId: s.skillId }),
          }, SKILLS[s.skillId].name, h('span', { class: 'cost' }, `${s.cost} 灵力${levelOf(p, s.skillId) > 1 ? ` · Lv.${levelOf(p, s.skillId)}` : ''}`))),
          itemActs.map((s) => h('button', {
            class: 'seal', disabled: manualLocked, title: ITEMS[s.itemId].desc,
            onclick: () => a.act({ type: 'item', itemId: s.itemId }),
          }, ITEMS[s.itemId].name, h('span', { class: 'cost' }, `×${s.count}`))),
          pillAuto(app, a),
        ),
      ],
    autoBar(app, a, { trial: b.enemy.isTrial }),
  );
}

// ---------- 魔界 ----------
function renderDemon(app, a) {
  const run = app.save.run;
  const p = run.player;
  const shards = run.demon.shards.length;
  const summon = canSummon(run);
  return h('section', { class: 'screen demon' },
    h('header', { class: 'topbar' },
      h('h1', { class: 'brand' }, '魔界'),
      h('div', { class: 'muted' }, `心魔碎片 ${shards}/${SHARDS_NEEDED}`)),
    h('p', { class: 'muted' }, '七情心魔劫：每个试炼有一个独特的规则。失败不会死，只是没有奖励，并被送出魔界。'),
    meter('生命', p.hp, p.stats.maxHp, 'hp'),
    h('div', { class: 'shop grow' },
      TRIALS.map((t) => {
        const done = trialCleared(run, t.id);
        return h('div', { class: `item-row ${done ? 'sold' : ''}` },
          h('div', { class: 'item-info' },
            h('b', null, `${t.icon} ${t.name} · ${t.title}`, done ? ' ✔' : ''),
            h('div', { class: 'muted' }, t.desc)),
          h('button', { class: 'seal small', disabled: done, onclick: () => a.challengeTrial(t.id) }, done ? '已通过' : '挑战'));
      }),
      h('div', { class: `item-row ${run.demon.won ? 'sold' : ''}` },
        h('div', { class: 'item-info' },
          h('b', null, `${FINAL.icon} ${FINAL.name}`, run.demon.won ? ' ✔' : ''),
          h('div', { class: 'muted' }, summon ? '七块碎片已集齐，道心已成，可以召唤终局首领。' : run.demon.won ? '你已击败过天道代行者。' : `需要集齐 ${SHARDS_NEEDED} 块碎片（现有 ${shards}）。`)),
        h('button', { class: 'seal small', disabled: !summon, onclick: a.summonFinal }, run.demon.won ? '已通关' : '召唤'))),
    h('button', { class: 'seal primary block', onclick: a.leaveDemon }, '离开魔界'),
  );
}

// 屏幕上方的短暂提示。每次重绘都会重建元素，所以用负的 animation-delay 接着上次的进度播放，不会重头闪
function toastLayer(app) {
  const now = Date.now();
  app.toasts = app.toasts.filter((t) => now - t.t0 < 3700);
  if (!app.toasts.length) return null;
  const flash = app.toasts.find((t) => ['legendary', 'mythic'].includes(t.rarity) && now - t.t0 < 1200);
  return h('div', { class: 'toast-layer', 'aria-live': 'polite' },
    flash ? h('div', { class: `rare-flash r-${flash.rarity}`, style: `animation-delay:${-(now - flash.t0)}ms` }) : null,
    h('div', { class: 'toasts' }, app.toasts.map((t) => h('div', { class: `toast ${t.kind}${t.rarity ? ` r-${t.rarity}` : ''}`, style: `animation-delay:${-(now - t.t0)}ms` }, rich(t.text)))));
}

function renderApp(app, a) {
  let screen;
  if (app.screen === 'battle') screen = renderBattle(app, a);
  else if (app.screen === 'shop' && app.save.run && app.save.run.shop) screen = renderShop(app, a);
  else if (app.screen === 'demon' && app.save.run) screen = renderDemon(app, a);
  else if (app.screen === 'explore' && app.save.run) screen = renderExplore(app, a);
  else screen = renderSelect(app, a);
  return h('div', { class: 'shell' }, screen, modal(app, a), toastLayer(app));
}

return { rootLabel, renderSelect, renderExplore, renderShop, renderBattle, renderDemon, renderApp };
},

"ui/richtext.js": function () {
// 把文字里的「[橙]传世剑」这类装备名切出来，供界面按品质着色。不依赖 DOM，便于测试
const { RARITIES, RARITY_INFO } = __req("data/equipment.js");

const NAME_TO_KEY = Object.fromEntries(RARITIES.map((r) => [RARITY_INFO[r].name, r]));
const RE = new RegExp(`\\[(${RARITIES.map((r) => RARITY_INFO[r].name).join('|')})\\]([^\\s、；，。：:（）()「」\\[\\]]+)`, 'g');

// 返回片段数组：{ text } 为普通文字，{ text, rarity } 为一件装备的名字（rarity 是品质键，如 'mythic'）
function splitRarity(text) {
  const out = [];
  const s = String(text);
  let last = 0;
  let m;
  RE.lastIndex = 0;
  while ((m = RE.exec(s))) {
    if (m.index > last) out.push({ text: s.slice(last, m.index) });
    out.push({ text: m[0], rarity: NAME_TO_KEY[m[1]] });
    last = m.index + m[0].length;
  }
  if (last < s.length) out.push({ text: s.slice(last) });
  return out;
}

return { splitRarity };
}
