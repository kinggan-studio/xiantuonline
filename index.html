  [1, 5, 13, 24, 30, 27], // 合体
  [0, 2, 7, 16, 30, 45], // 渡劫
];

// 属性与价格随境界成长的系数，与敌人/玩家属性曲线（×1.7^境界）一致
const growth = (realm) => Math.pow(1.7, realm);
// 炼气期每层历练的期望元宝收入。测试会用事件权重和怪物元宝核算，必须与数据一致
const INCOME_PER_LAYER = 9;
// 武器、衣服属性最强，价格最高；其余六个部位属性较小，价格也低一些
const SLOT_PRICE_FACTOR = { weapon: 1.1, armor: 1.0, bracer: 0.8, boots: 0.8, talisman: 0.8, jade: 0.8, ring: 0.8, necklace: 0.8 };

// 装备属性的全局系数：8 个部位全部穿满时总属性很可观，所以每件装备的属性整体打折，由模拟器标定
const GEAR_SCALE = 0.4;
const CRIT_CAP = 0.75; // 暴击率上限（8 个部位的暴击加成叠起来不能无限高）

// 模板：炼气期、白装、浮动为 1 时的基础属性（再乘 GEAR_SCALE）
const TEMPLATES = [
  // 武器
  { id: 'sword', name: '剑', slot: 'weapon', icon: '🗡️', stats: { atk: 4 } },
  { id: 'blade', name: '刀', slot: 'weapon', icon: '🔪', stats: { atk: 3, crit: 0.02 } },
  { id: 'spear', name: '枪', slot: 'weapon', icon: '🔱', stats: { atk: 3, spd: 1 } },
  // 衣服
  { id: 'robe', name: '长袍', slot: 'armor', icon: '👘', stats: { maxHp: 25 } },
  { id: 'leather', name: '皮甲', slot: 'armor', icon: '🥋', stats: { def: 3, maxHp: 12 } },
  { id: 'plate', name: '铁甲', slot: 'armor', icon: '🛡️', stats: { def: 5 } },
  // 护腕
  { id: 'bracer_iron', name: '铁护腕', slot: 'bracer', icon: '🧤', stats: { def: 2, atk: 1 } },
  { id: 'bracer_leather', name: '皮护腕', slot: 'bracer', icon: '🥊', stats: { atk: 2 } },
  { id: 'bracer_silk', name: '云纹护腕', slot: 'bracer', icon: '🧤', stats: { maxHp: 12, def: 1 } },
  // 鞋子
  { id: 'boots_cloth', name: '布靴', slot: 'boots', icon: '👟', stats: { spd: 2 } },
  { id: 'boots_leather', name: '皮靴', slot: 'boots', icon: '👢', stats: { spd: 1, maxHp: 10 } },
  { id: 'boots_war', name: '战靴', slot: 'boots', icon: '🥾', stats: { spd: 1, def: 2 } },
  // 护符
  { id: 'charm_peace', name: '平安符', slot: 'talisman', icon: '📜', stats: { maxHp: 12, maxMp: 6 } },
  { id: 'charm_thunder', name: '雷光符', slot: 'talisman', icon: '🧿', stats: { crit: 0.02, atk: 1 } },
  { id: 'charm_spirit', name: '灵符', slot: 'talisman', icon: '🔮', stats: { maxMp: 10, def: 1 } },
  // 玉佩
  { id: 'jade', name: '玉佩', slot: 'jade', icon: '💎', stats: { maxMp: 12 } },
  { id: 'jade_warm', name: '暖玉佩', slot: 'jade', icon: '🔹', stats: { maxHp: 12, maxMp: 5 } },
  { id: 'jade_ice', name: '寒玉佩', slot: 'jade', icon: '❄️', stats: { def: 2, maxMp: 6 } },
  // 戒指
  { id: 'ring', name: '戒指', slot: 'ring', icon: '💍', stats: { atk: 1, maxHp: 6 } },
  { id: 'ring_silver', name: '银戒', slot: 'ring', icon: '⭕', stats: { crit: 0.02, maxHp: 5 } },
  { id: 'ring_jade', name: '玉戒', slot: 'ring', icon: '🔘', stats: { atk: 1, maxMp: 6 } },
  // 项链
  { id: 'pendant', name: '项坠', slot: 'necklace', icon: '🪶', stats: { spd: 1, crit: 0.015 } },
  { id: 'necklace_bead', name: '珠链', slot: 'necklace', icon: '📿', stats: { maxMp: 8, maxHp: 8 } },
  { id: 'necklace_fang', name: '兽牙项链', slot: 'necklace', icon: '🦷', stats: { atk: 1, crit: 0.02 } },
];

// 词条（蓝装及以上）：base 为蓝装的百分数，紫 ×1.5，黄 ×2，橙 ×2.6。build 返回 { effects?, mods? }，desc 为说明
const AFFIX_SCALE = { rare: 1, epic: 1.5, legendary: 2, mythic: 2.6 };
const AFFIXES = [
  {
    id: 'leech', name: '嗜血', base: 5,
    build: (pct) => ({ effects: [{ on: 'attack', do: { op: 'heal', pctOfDealt: pct / 100 } }] }),
    desc: (pct) => `攻击时吸取伤害的 ${pct}% 为生命`,
  },
  {
    id: 'feast', name: '噬魂', base: 6,
    build: (pct) => ({ effects: [{ on: 'kill', do: { op: 'heal', pct: pct / 100 } }] }),
    desc: (pct) => `击杀敌人回复 ${pct}% 生命`,
  },
  {
    id: 'wealth', name: '聚财', base: 10,
    build: (pct) => ({ mods: { goldMul: pct / 100 } }),
    desc: (pct) => `元宝收入 +${pct}%`,
  },
  {
    id: 'focus', name: '凝神', base: 3,
    build: (pct) => ({ effects: [{ on: 'turnStart', do: { op: 'mp', pct: pct / 100 } }] }),
    desc: (pct) => `每回合开始回复 ${pct}% 灵力`,
  },
  {
    id: 'thorns', name: '反震', base: 12,
    build: (pct) => ({ effects: [{ on: 'hit', do: { op: 'damage', pct: pct / 100 } }] }),
    desc: (pct) => `受击时反震攻击者（攻击力 ${pct}%）`,
  },
];

const STAT_LABELS = { maxHp: '生命', atk: '攻击', def: '防御', maxMp: '灵力', spd: '身法', crit: '暴击率' };

// 装备的属性与词条文字，如「攻击 +9 · 暴击率 +5% · 嗜血：攻击时吸取伤害的 5% 为生命」
function describeItem(item) {
  const parts = [];
  for (const [k, v] of Object.entries(item.stats || {})) {
    parts.push(`${STAT_LABELS[k]} +${k === 'crit' ? `${Math.round(v * 1000) / 10}%` : v}`);
  }
  for (const a of item.affixes || []) parts.push(a.name ? `${a.name}：${a.desc}` : a.desc);
  return parts.join(' · ');
}

// 带品质的名字，如「[橙]传世剑」
function itemTitle(item) {
  return `[${RARITY_INFO[item.rarity].name}]${item.name}`;
}

return { SLOTS, SLOT_NAMES, BAG_MAX, SELL_RATE, SHOP_SELL_RATE, RARITIES, RARITY_INFO, RARITY_WEIGHTS, growth, INCOME_PER_LAYER, SLOT_PRICE_FACTOR, GEAR_SCALE, CRIT_CAP, TEMPLATES, AFFIX_SCALE, AFFIXES, STAT_LABELS, describeItem, itemTitle };
},
"engine/loot.js": function () {
// 随机装备的生成与定价。商人、魔修掉落、宝箱共用这里，品质概率都看玩家当前境界
const { RARITIES, RARITY_INFO, RARITY_WEIGHTS, TEMPLATES, AFFIXES, AFFIX_SCALE, SLOTS, growth, INCOME_PER_LAYER, SLOT_PRICE_FACTOR, SELL_RATE, GEAR_SCALE } = __req("data/equipment.js");

// 按境界的概率表抽一个品质：境界越高，越容易抽到好品质
function rollRarity(rng, realm) {
  const row = RARITY_WEIGHTS[Math.min(Math.max(realm, 0), RARITY_WEIGHTS.length - 1)];
  const total = row.reduce((s, w) => s + w, 0);
  let x = rng.next() * total;
  for (let i = 0; i < row.length; i++) {
    x -= row[i];
    if (x < 0) return RARITIES[i];
  }
  return RARITIES[RARITIES.length - 1];
}

const newUid = (rng) => `e${rng.int(0, 0x7fffffff).toString(36)}${rng.int(0, 1295).toString(36)}`;

// 生成一件随机装备实例。每条属性在 ±15% 内独立浮动；蓝装起带词条。
// opts.rarity / opts.slot 可强制指定（测试或特殊奖励用）
function generateEquipment(rng, realm, opts = {}) {
  let rarity = opts.rarity || rollRarity(rng, realm);
  if (opts.minRarity && RARITIES.indexOf(rarity) < RARITIES.indexOf(opts.minRarity)) rarity = opts.minRarity; // 至少这个品质
  const info = RARITY_INFO[rarity];
  const slot = opts.slot || rng.pick(SLOTS); // 先均匀选一个部位，再选这个部位的模板
  const tpl = rng.pick(TEMPLATES.filter((t) => t.slot === slot));

  const stats = {};
  let rollSum = 0;
  let rollCount = 0;
  for (const [k, base] of Object.entries(tpl.stats)) {
    const roll = 0.85 + rng.next() * 0.3;
    rollSum += roll;
    rollCount += 1;
    if (k === 'crit') stats[k] = Math.max(0.005, Math.round(base * info.mul * roll * GEAR_SCALE * 200) / 200); // 0.5% 一档
    else if (k === 'spd') stats[k] = Math.max(1, Math.round(base * (1 + 0.4 * realm) * info.mul * roll * GEAR_SCALE));
    else stats[k] = Math.max(1, Math.round(base * growth(realm) * info.mul * roll * GEAR_SCALE));
  }

  const effects = [];
  const mods = {};
  const affixes = [];
  const affixPool = [...AFFIXES];
  for (let i = 0; i < info.affixes; i++) {
    const a = affixPool.splice(rng.int(0, affixPool.length - 1), 1)[0];
    const pct = Math.max(1, Math.round(a.base * AFFIX_SCALE[rarity]));
    const built = a.build(pct);
    effects.push(...(built.effects || []));
    for (const [k, v] of Object.entries(built.mods || {})) mods[k] = (mods[k] || 0) + v;
    affixes.push({ id: a.id, name: a.name, desc: a.desc(pct) });
  }

  const avgRoll = rollSum / rollCount; // 属性浮动越好，价格越高
  const price = Math.max(1, Math.round(info.layers * INCOME_PER_LAYER * growth(realm) * SLOT_PRICE_FACTOR[tpl.slot] * avgRoll));
  return {
    uid: newUid(rng),
    tpl: tpl.id,
    name: `${info.prefix}${tpl.name}`,
    icon: tpl.icon,
    slot: tpl.slot,
    rarity,
    realm,
    stats,
    effects,
    mods,
    affixes,
    price,
  };
}

// 行囊满了、或卸下多余装备时折算成元宝的数额
const sellValue = (item) => Math.max(1, Math.round(item.price * SELL_RATE));

// 武学、药品的价格也随境界放大（与元宝收入同步）
const skillPrice = (skill, realm) => Math.max(1, Math.round(skill.price * growth(realm)));
const pillPrice = (item, realm) => Math.max(1, Math.round(item.price * growth(realm)));

return { rollRarity, generateEquipment, sellValue, skillPrice, pillPrice };
},
"engine/inventory.js": function () {
// 行囊：装备的穿脱、武学栏的装卸、学会/升级武学。都直接修改 player 并返回结果
const { SKILLS, SKILL_MAX_LEVEL, SKILL_MAXED_REFUND } = __req("data/skills.js");
const { BAG_MAX, growth, SHOP_SELL_RATE } = __req("data/equipment.js");
const { LOADOUT_MAX, recomputePlayer } = __req("engine/state.js");
const { sellValue } = __req("engine/loot.js");

const skillLevel = (p, id) => (p.skillLevels && p.skillLevels[id]) || (p.learned.includes(id) ? 1 : 0);
const bagFull = (p) => p.bag.equipment.length >= BAG_MAX;

// 装备放进行囊；行囊满了就自动折算成元宝
function addToBag(p, item) {
  if (bagFull(p)) {
    const gold = sellValue(item);
    p.gold += gold;
    return { stored: false, gold };
  }
  p.bag.equipment.push(item);
  return { stored: true, gold: 0 };
}

function equipItem(p, uid) {
  const i = p.bag.equipment.findIndex((it) => it.uid === uid);
  if (i < 0) return { ok: false, msg: '行囊里没有这件装备' };
  const item = p.bag.equipment.splice(i, 1)[0];
  const prev = p.equipment[item.slot];
  if (prev) p.bag.equipment.push(prev);
  p.equipment[item.slot] = item;
  recomputePlayer(p);
  return { ok: true, msg: `装备了「${item.name}」` };
}

function unequipItem(p, slot) {
  const item = p.equipment[slot];
  if (!item) return { ok: false, msg: '该槽位是空的' };
  if (bagFull(p)) return { ok: false, msg: `行囊已满（${BAG_MAX} 件），无法卸下` };
  p.equipment[slot] = null;
  p.bag.equipment.push(item);
  recomputePlayer(p);
  return { ok: true, msg: `卸下了「${item.name}」` };
}

// 武学栏：已装备则卸下，未装备则装上（最多 LOADOUT_MAX 个）
function toggleLoadout(p, skillId) {
  if (!p.learned.includes(skillId)) return { ok: false, msg: '还没有学会这门武学' };
  const i = p.skills.indexOf(skillId);
  if (i >= 0) {
    p.skills.splice(i, 1);
    return { ok: true, msg: `卸下了「${SKILLS[skillId].name}」` };
  }
  if (p.skills.length >= LOADOUT_MAX) return { ok: false, msg: `武学栏已满（最多 ${LOADOUT_MAX} 个），先卸下一个` };
  p.skills.push(skillId);
  return { ok: true, msg: `装备了「${SKILLS[skillId].name}」` };
}

// 获得一门武学。新武学：学会，武学栏有空位就自动装上；重复获得：升一级；已满级：折算元宝
// 返回 { result:'new'|'level'|'maxed', level, autoEquipped?, gold? }
function learnSkill(p, skillId) {
  if (!p.skillLevels) p.skillLevels = {};
  if (!p.learned.includes(skillId)) {
    p.learned.push(skillId);
    p.skillLevels[skillId] = 1;
    const autoEquipped = !p.skills.includes(skillId) && p.skills.length < LOADOUT_MAX;
    if (autoEquipped) p.skills.push(skillId);
    return { result: 'new', level: 1, autoEquipped };
  }
  const lv = skillLevel(p, skillId);
  if (lv >= SKILL_MAX_LEVEL) {
    const gold = Math.round(SKILLS[skillId].price * growth(p.realm || 0) * SKILL_MAXED_REFUND);
    p.gold += gold;
    return { result: 'maxed', level: lv, gold };
  }
  p.skillLevels[skillId] = lv + 1;
  return { result: 'level', level: lv + 1 };
}

function describeLearn(res, skillId) {
  const name = SKILLS[skillId].name;
  if (res.result === 'new') return `学会武学「${name}」${res.autoEquipped ? '（已装入武学栏）' : ''}`;
  if (res.result === 'level') return `武学「${name}」升至 Lv.${res.level}`;
  return `武学「${name}」已臻圆满，折算 ${res.gold} 元宝`;
}

// ---- 武学秘籍：获得的武学先放进行囊，由玩家决定学会/升级还是卖掉 ----
const bookCount = (p, id) => (p.bag.books && p.bag.books[id]) || 0;
const totalBooks = (p) => Object.values(p.bag.books || {}).reduce((s, n) => s + n, 0);

function addBook(p, skillId, n = 1) {
  if (!SKILLS[skillId]) throw new Error(`未知武学: ${skillId}`);
  if (!p.bag.books) p.bag.books = {};
  p.bag.books[skillId] = (p.bag.books[skillId] || 0) + n;
}

function takeBook(p, skillId) {
  p.bag.books[skillId] -= 1;
  if (p.bag.books[skillId] <= 0) delete p.bag.books[skillId];
}

// 研读秘籍：新武学则学会（武学栏有空位自动装上），已学会则升一级。满级的不能再研读（只能卖掉）
function studyBook(p, skillId) {
  if (bookCount(p, skillId) <= 0) return { ok: false, msg: '行囊里没有这本秘籍' };
  if (skillLevel(p, skillId) >= SKILL_MAX_LEVEL) return { ok: false, msg: '这门武学已经满级了，秘籍只能卖掉' };
  const r = learnSkill(p, skillId);
  takeBook(p, skillId);
  return { ok: true, msg: describeLearn(r, skillId), result: r };
}

// ---- 在行商处出售：价格都低于买价 ----
const sellPrice = (base) => Math.max(1, Math.round(base * SHOP_SELL_RATE));
const equipSellPrice = (item) => sellPrice(item.price);
const bookSellPrice = (p, skillId) => sellPrice(SKILLS[skillId].price * growth(p.realm || 0));
// 已学会的武学：按等级折算（每一级相当于一本秘籍）
const skillSellPrice = (p, skillId) => bookSellPrice(p, skillId) * skillLevel(p, skillId);

function sellEquipment(p, uid) {
  const i = p.bag.equipment.findIndex((it) => it.uid === uid);
  if (i < 0) return { ok: false, msg: '行囊里没有这件装备（穿在身上的先卸下）' };
  const item = p.bag.equipment.splice(i, 1)[0];
  const gold = equipSellPrice(item);
  p.gold += gold;
  return { ok: true, gold, msg: `卖出「${item.name}」，得 ${gold} 元宝`, item };
}

// 一键出售不高于 maxRarity 品质的行囊装备
function sellJunk(p, rarities) {
  const keep = [];
  let n = 0, gold = 0;
  for (const it of p.bag.equipment) {
    if (rarities.includes(it.rarity)) { n += 1; gold += equipSellPrice(it); } else keep.push(it);
  }
  p.bag.equipment = keep;
  p.gold += gold;
  return { ok: n > 0, n, gold, msg: n ? `一共卖出 ${n} 件装备，得 ${gold} 元宝` : '没有可卖的装备' };
}

function sellBook(p, skillId) {
  if (bookCount(p, skillId) <= 0) return { ok: false, msg: '行囊里没有这本秘籍' };
  const gold = bookSellPrice(p, skillId);
  takeBook(p, skillId);
  p.gold += gold;
  return { ok: true, gold, msg: `卖出《${SKILLS[skillId].name}》秘籍，得 ${gold} 元宝` };
}

// 卖掉已学会的武学（相当于遗忘）。至少要留一门，否则没法战斗
function sellLearnedSkill(p, skillId) {
  if (!p.learned.includes(skillId)) return { ok: false, msg: '你没有学会这门武学' };
  if (p.learned.length <= 1) return { ok: false, msg: '至少要留一门武学' };
  const gold = skillSellPrice(p, skillId);
  p.learned = p.learned.filter((x) => x !== skillId);
  p.skills = p.skills.filter((x) => x !== skillId);
  delete p.skillLevels[skillId];
  p.gold += gold;
  return { ok: true, gold, msg: `遗忘并卖出「${SKILLS[skillId].name}」，得 ${gold} 元宝` };
}

function sellPill(p, itemId, itemPrice) {
  if (!((p.items[itemId] || 0) > 0)) return { ok: false, msg: '没有这种丹药了' };
  const gold = sellPrice(itemPrice);
  p.items[itemId] -= 1;
  p.gold += gold;
  return { ok: true, gold, msg: `卖出一颗丹药，得 ${gold} 元宝` };
}

return { skillLevel, bagFull, addToBag, equipItem, unequipItem, toggleLoadout, learnSkill, describeLearn, bookCount, totalBooks, addBook, studyBook, sellPrice, equipSellPrice, bookSellPrice, skillSellPrice, sellEquipment, sellJunk, sellBook, sellLearnedSkill, sellPill };
},
"engine/state.js": function () {
const { SECTS } = __req("data/sects.js");
const { ROOTS, QUALITIES, getQuality } = __req("data/roots.js");
const { MONSTERS } = __req("data/monsters.js");
const { realmStats } = __req("data/realms.js");
const { SLOTS, growth, CRIT_CAP } = __req("data/equipment.js");
const { ENEMY_ATK } = __req("data/world.js");
const { bandIndexAt, realmFloat, enemyPower } = __req("engine/world.js");

const DEFAULT_ITEMS = { hp_pill: 3, mp_pill: 1 };
const LOADOUT_MAX = 4; // 武学栏数量
const START_GOLD = 50;
const clone = (x) => JSON.parse(JSON.stringify(x));

// 刷新灵根：随机一个已解锁的灵根属性 + 一个品质（按权重）
function rollRoot(rng, unlocks = []) {
  const pool = Object.values(ROOTS).filter((r) => !r.locked || unlocks.includes(r.id));
  const root = rng.pick(pool);
  const total = QUALITIES.reduce((sum, q) => sum + q.weight, 0);
  let x = rng.next() * total;
  let quality = QUALITIES[QUALITIES.length - 1];
  for (const q of QUALITIES) {
    x -= q.weight;
    if (x < 0) {
      quality = q;
      break;
    }
  }
  return { rootId: root.id, quality: quality.id };
}

// 境界基础属性 × 宗门 × 灵根（灵根加成按品质倍率缩放）
function computeStats(realm, stage, sect, root, qualityId = 'pu') {
  const s = realmStats(realm, stage);
  const q = getQuality(qualityId).mul;
  for (const [k, v] of Object.entries(sect.statMul || {})) s[k] *= v;
  for (const [k, v] of Object.entries(sect.statAdd || {})) s[k] += v;
  for (const [k, v] of Object.entries(root.statMul || {})) s[k] *= 1 + (v - 1) * q;
  for (const [k, v] of Object.entries(root.statAdd || {})) s[k] += v * q;
  for (const k of ['maxHp', 'atk', 'def', 'maxMp', 'spd']) s[k] = Math.round(s[k]);
  s.crit = Math.round(s.crit * 1000) / 1000;
  s.critDmg = Math.round(s.critDmg * 1000) / 1000;
  return s;
}

// 根据境界、宗门、灵根与已装备的装备，重新计算属性、触发效果、机制数值与擅长标签。
// 装备/卸下装备、读取旧存档后都要调用。生命上限提高时，当前生命同步提高，不会因换装而"空血"
function recomputePlayer(p) {
  const sect = SECTS[p.sectId];
  const root = ROOTS[p.rootId];
  const prev = p.stats;
  const stats = computeStats(p.realm, p.stage, sect, root, p.rootQuality || 'pu');
  const mods = clone(sect.mods || {});
  const effects = sect.passive.effects.map(clone);
  for (const slot of SLOTS) {
    const it = (p.equipment || {})[slot]; // 装备是随机生成的实例，属性直接存在实例上
    if (!it) continue;
    for (const [k, v] of Object.entries(it.stats || {})) stats[k] += v;
    for (const e of it.effects || []) effects.push(clone(e));
    for (const [k, v] of Object.entries(it.mods || {})) mods[k] = (mods[k] || 0) + v;
  }
  // 道果加持：按总属性（含装备）计算
  const dao = p.dao || {};
  if (dao.body) { stats.maxHp = Math.round(stats.maxHp * (1 + 0.03 * dao.body)); stats.def = Math.round(stats.def * (1 + 0.03 * dao.body)); }
  if (dao.might) stats.atk = Math.round(stats.atk * (1 + 0.03 * dao.might));
  if (dao.fortune) mods.goldMul = (mods.goldMul || 0) + 0.05 * dao.fortune;
  stats.crit = Math.min(CRIT_CAP, Math.round(stats.crit * 1000) / 1000);
  p.lv = p.realm + Math.log(1 + 0.25 * p.stage) / Math.log(1.7); // 等级：用于把防御按等级归一化
  p.stats = stats;
  p.mods = mods;
  p.effects = effects;
  p.affinity = sect.affinity;
  if (prev) {
    p.hp = Math.min(stats.maxHp, p.hp + Math.max(0, stats.maxHp - prev.maxHp));
    p.mp = Math.min(stats.maxMp, p.mp + Math.max(0, stats.maxMp - prev.maxMp));
  }
  return p;
}

function createPlayer({ sectId, rootId, quality = 'pu', name = '你', cycle = 1, dao = {} }) {
  const sect = SECTS[sectId];
  const root = ROOTS[rootId];
  if (!sect) throw new Error(`未知宗门: ${sectId}`);
  if (!root) throw new Error(`未知灵根: ${rootId}`);
  const items = { ...DEFAULT_ITEMS };
  for (const [id, n] of Object.entries(sect.startItems || {})) items[id] = (items[id] || 0) + n;
  items.hp_pill += dao.stock || 0;
  const p = {
    id: 'player',
    name,
    side: 'player',
    icon: sect.icon,
    sectId,
    rootId,
    rootQuality: quality,
    realm: 0,
    stage: 0,
    element: root.element,
    hp: 0,
    mp: 0,
    shield: 0,
    gold: START_GOLD + 100 * (dao.stock || 0),
    cycle, // 第几周目：敌人强度随周目提高
    dao: { ...dao }, // 道果加持等级（永久强化）
    skills: [...sect.starterSkills], // 武学栏（已装备的武学）
    learned: [...sect.starterSkills], // 已学会的全部武学
    skillLevels: Object.fromEntries(sect.starterSkills.map((id) => [id, 1])), // 武学等级，重复获得会升级
    equipment: Object.fromEntries(SLOTS.map((s) => [s, null])), // 已穿戴的装备实例（8 个部位）
    bag: { equipment: [], books: {} }, // 未穿戴的装备实例；武学秘籍 { 武学id: 数量 }
    souls: 0,
    keys: 0, // 心魔钥匙：进入魔界要消耗
    statuses: [],
    items,
    flags: { used: {}, stacks: {} },
    dead: false,
  };
  recomputePlayer(p);
  p.hp = p.stats.maxHp;
  p.mp = p.stats.maxMp;
  return p;
}

// 生成敌人：depth 为所在层数，数值按深度连续放大，名字随区域变化。depth 缺省为 0（炼气期起点）
function createEnemy(monsterId, depth = 0, cycle = 1) {
  const m = MONSTERS[monsterId];
  if (!m) throw new Error(`未知怪物: ${monsterId}`);
  const f = realmFloat(depth);
  const k = enemyPower(depth, cycle);
  const g = growth(f);
  const b = m.stats;
  const maxMp = Math.round(b.maxMp * (1 + 0.5 * f));
  const maxHp = Math.round(b.maxHp * k);
  return {
    id: m.id,
    name: (m.names && m.names[bandIndexAt(depth)]) || m.name,
    side: 'enemy',
    icon: m.icon,
    element: m.element,
    human: !!m.human,
    lv: f,
    gold: m.gold ? [Math.round(m.gold[0] * g), Math.round(m.gold[1] * g)] : [0, 0],
    loot: m.loot ? { ...m.loot } : {},
    stats: {
      maxHp, atk: Math.max(1, Math.round(b.atk * k * ENEMY_ATK)), def: Math.round(b.def * k), maxMp,
      spd: Math.round(b.spd + 2 * f), crit: b.crit, critDmg: b.critDmg,
    },
    hp: maxHp,
    mp: maxMp,
    shield: 0,
    skills: [...m.skills],
    effects: (m.effects || []).map(clone),
    statuses: [],
    items: {},
    flags: { used: {}, stacks: {} },
    dead: false,
  };
}

// 每场战斗开始前清理一次性标记与临时状态（复生等"每场首次"效果、剑意叠层由此重置）
function resetForBattle(unit) {
  unit.statuses = [];
  unit.shield = 0;
  unit.flags = { used: {}, stacks: {} };
  unit.dead = false;
}

function restore(unit, hpPct, mpPct) {
  const hp0 = unit.hp;
  const mp0 = unit.mp;
  unit.hp = Math.min(unit.stats.maxHp, unit.hp + Math.round(unit.stats.maxHp * hpPct));
  unit.mp = Math.min(unit.stats.maxMp, unit.mp + Math.round(unit.stats.maxMp * mpPct));
  return { hp: unit.hp - hp0, mp: unit.mp - mp0 };
}

// 恢复节奏（占最大生命/灵力的比例）。要支撑几千层的长线历练，恢复必须与战斗消耗大致持平
const REGEN = {
  battle: [0.25, 0.4], // 战斗胜利后
  walk: [0.04, 0.08], // 每前进一层（赶路）
  camp: [0.4, 0.5], // 营地休息
  // 战后调息随境界递减：炼气期照常，越往后恢复越少，逼玩家靠丹药、营地和装备撑过去（下限 battleFloor）
  battleDecay: 0.05, // 每升一个大境界，战后恢复少 5%（相对炼气期）
  battleFloor: 0.5,
};

// 战斗胜利后的恢复
function recoverAfterBattle(unit) {
  const k = Math.max(REGEN.battleFloor, 1 - REGEN.battleDecay * (unit.realm || 0));
  return restore(unit, REGEN.battle[0] * k, REGEN.battle[1] * k);
}

// 赶路回复：每前进一层，慢慢恢复一点
function walkRegen(unit) {
  return restore(unit, REGEN.walk[0], REGEN.walk[1]);
}

// 营地休息：恢复更多
function restAtCamp(unit) {
  return restore(unit, REGEN.camp[0], REGEN.camp[1]);
}

// 历练记录：保留最近 max 条，刷新页面后仍在（存在 run.journal 里，旧存档没有则自动补上）
function appendJournal(run, entries, max = 120) {
  if (!Array.isArray(run.journal)) run.journal = [];
  run.journal.push(...entries.map((e) => ({ text: e.text, kind: e.kind || 'info', ...(e.crit ? { crit: true } : {}) })));
  if (run.journal.length > max) run.journal.splice(0, run.journal.length - max);
  return run.journal;
}

function createNewRun({ sectId, rootId, quality = 'pu', seed, cycle = 1, dao = {} }) {
  return {
    cycle,
    player: createPlayer({ sectId, rootId, quality, cycle, dao }),
    region: 'qingyun',
    depth: 0,
    kills: 0,
    cleared: 0, // 已击败的区域首领数；每击败一个才能进入下一个区域
    demon: { shards: [], won: false, inside: false }, // 魔界：已通过的试炼（碎片）、是否通关、是否正在魔界里
    journal: [],
    shop: null, // 正在逛的商人库存（刷新页面不会重新刷货）
    cave: null, // 洞府奇遇的待选状态（刷新页面后仍要选）
    swindle: null, // 女骗子的待决状态：{ price, real, sees, mode }
    npc: null, // 回头客的记忆：被偷走的东西、被骗的元宝、在行商处的购买次数（用 npcOf 读取）
    rngState: seed >>> 0,
  };
}

return { LOADOUT_MAX, START_GOLD, rollRoot, computeStats, recomputePlayer, createPlayer, createEnemy, resetForBattle, REGEN, recoverAfterBattle, walkRegen, restAtCamp, appendJournal, createNewRun };
},

"data/realms.js": function () {
const REALMS = ['炼气', '筑基', '金丹', '元婴', '化神', '炼虚', '合体', '渡劫'];
const STAGES = ['前期', '中期', '后期'];

// 境界属性曲线：按境界与阶段给出基础属性，随境界单调递增
function realmStats(realmIndex, stageIndex) {
  const k = Math.pow(1.7, realmIndex) * (1 + stageIndex * 0.25);
  return {
    maxHp: Math.round(120 * k),
    atk: Math.round(12 * k),
    def: Math.round(6 * k),
    maxMp: Math.round(50 * (1 + realmIndex * 0.5) * (1 + stageIndex * 0.1)),
    spd: 10 + realmIndex * 2 + stageIndex,
    crit: 0.05,
    critDmg: 1.5,
  };
}

function realmName(realmIndex, stageIndex) {
  return REALMS[realmIndex] + STAGES[stageIndex];
}

return { REALMS, STAGES, realmStats, realmName };
},

// from/to 为层数区间；realm 为该区域对应的境界（敌人强度的起点）。最后一个区域无尽，敌人继续变强直到玩家倒下
const BANDS = [
  { id: 'qingyun', name: '青云山脉', realm: 0, from: 0, to: 150 },
  { id: 'youming', name: '幽冥古墓', realm: 1, from: 150, to: 450 },

const ENDLESS_SPAN = 1500; // 无尽区域里每过多少层，敌人强度提高一个大境界
const ENEMY_ATK = 0.45; // 敌人攻击的全局系数：要连续打几千场，一场战斗只应消耗一部分生命，由模拟器标定
const ENEMY_EXTRA = 0.30; // 敌人强度额外的线性加成（1 + ENEMY_EXTRA × 境界浮点数），由模拟器调平衡
// 后期加陡：从 LATE_FROM 境界起，每多一个境界，敌人再额外 ×LATE_GROWTH。装备堆起来之后玩家成长会超过普通曲线，靠这一项把后期拉回来
// 做成对象是为了让模拟器能临时改值来标定；游戏里不会修改

// 周目：每多一个周目，所有敌人的生命、攻击、防御同时 +cycleStep（第 n 周目 = 1 + cycleStep × (n-1)）。生命和攻击一起涨，实际难度约为它的平方，所以步长要小

// 瓶颈首领：每个大境界突破前必须击败。数值是同境界末期普通敌人的数倍

  elements: ['火', '木', '水', '土', '金', '暗', '火', '土'],
};

return { BANDS, ENDLESS_SPAN, ENEMY_ATK, ENEMY_EXTRA, CURVE, BOSS };

"engine/world.js": function () {
// 世界：由层数得到所在区域、敌人强度（连续增长）
const { BANDS, ENDLESS_SPAN, ENEMY_EXTRA, CURVE } = __req("data/world.js");
const { growth } = __req("data/equipment.js");

function bandIndexAt(depth) {
  for (let i = 0; i < BANDS.length; i++) if (depth < BANDS[i].to) return i;
  return BANDS.length - 1;
}

const bandAt = (depth) => BANDS[bandIndexAt(depth)];

// 层数 → 境界浮点数：区域起点是该区域的境界，走完整个区域则增加 1。无尽区域每 ENDLESS_SPAN 层加 1
function realmFloat(depth) {
  const b = bandAt(depth);
  const span = b.to === Infinity ? ENDLESS_SPAN : b.to - b.from;
  return b.realm + (depth - b.from) / span;
}

// 后期加陡的倍数：LATE_FROM 境界之前为 1
const lateMul = (f) => Math.pow(CURVE.lateGrowth, Math.max(0, f - CURVE.lateFrom));

// 周目倍数：第 1 周目为 1
const cycleMul = (cycle = 1) => 1 + CURVE.cycleStep * (Math.max(1, cycle) - 1);

// 敌人属性（生命、攻击、防御）的放大倍数。f 为境界浮点数
const powerAt = (f, cycle = 1) => growth(f) * (1 + ENEMY_EXTRA * f) * lateMul(f) * cycleMul(cycle);

function enemyPower(depth, cycle = 1) {
  return powerAt(realmFloat(depth), cycle);
}

return { bandIndexAt, bandAt, realmFloat, lateMul, cycleMul, powerAt, enemyPower };
},

"engine/economy.js": function () {
// 经济核算：用事件权重和怪物元宝算出「每层历练的期望元宝收入」，定价都以它为基准
const { REGIONS } = __req("data/regions.js");
const { MONSTERS } = __req("data/monsters.js");

// 宝箱中开出元宝的概率与金额区间（与 rewards.rollChest 保持一致）
const CHEST_GOLD_CHANCE = 0.35;
const CHEST_GOLD_RANGE = [18, 42];

// 某区域、炼气期（境界系数 1）、无元宝加成时，每层历练的期望元宝收入
function expectedIncomePerLayer(regionId = 'qingyun') {
  const region = REGIONS[regionId];
  const total = region.events.reduce((s, e) => s + e.weight, 0);
  let income = 0;
  for (const e of region.events) {
    const p = e.weight / total;
    if (e.monsters) {
      const avg = e.monsters.reduce((s, id) => s + (MONSTERS[id].gold[0] + MONSTERS[id].gold[1]) / 2, 0) / e.monsters.length;
      income += p * avg;
    } else if (e.id === 'treasure') {
      income += p * CHEST_GOLD_CHANCE * ((CHEST_GOLD_RANGE[0] + CHEST_GOLD_RANGE[1]) / 2);
    }
  }
  return income;
}

return { CHEST_GOLD_CHANCE, CHEST_GOLD_RANGE, expectedIncomePerLayer };
},

const { ACHIEVEMENTS } = __req("data/achievements.js");
const { MONSTERS } = __req("data/monsters.js");

const newStats = () => ({ kills: 0, best: 0, drops: {}, thefts: 0, caught: 0, fakes: 0, reals: 0, caves: 0, trials: 0, monsters: {}, maxSkill: 1 });

// 读取 meta.stats（旧存档没有则补上，缺字段补默认）
function stats(meta) {
  meta.stats = { ...newStats(), ...(meta.stats || {}) };
  meta.stats.drops = meta.stats.drops || {};
  meta.stats.monsters = meta.stats.monsters || {};
  return meta.stats;
}

function recordKill(meta, enemyId) {
  const st = stats(meta);
  st.kills += 1;
  st.monsters[enemyId] = (st.monsters[enemyId] || 0) + 1;
}
function recordDrop(meta, item) {
  const st = stats(meta);
  st.drops[item.rarity] = (st.drops[item.rarity] || 0) + 1;
}
function bump(meta, key, n = 1) {
  const st = stats(meta);
  st[key] = (st[key] || 0) + n;
}

// 当前所有判断条件用的数据
function snapshot(meta, ctx = {}) {
  const st = stats(meta);
  st.best = Math.max(st.best || 0, ctx.depth || 0);
  if (ctx.maxSkill) st.maxSkill = Math.max(st.maxSkill || 1, ctx.maxSkill);
  return {
    depth: st.best, kills: st.kills, drops: st.drops, thefts: st.thefts, caught: st.caught, fakes: st.fakes || 0, reals: st.reals || 0, caves: st.caves,
    trials: st.trials, endings: meta.endings || 0, rebirths: meta.rebirths || 0, maxSkill: st.maxSkill || 1,
    dex: Object.keys(st.monsters).length, dexAll: Object.keys(MONSTERS).length,
  };
}

// 检查新达成的成就：记入 meta.achievements、发放道果，返回新达成的列表
function checkAchievements(meta, ctx = {}) {
  if (!Array.isArray(meta.achievements)) meta.achievements = [];
  const s = snapshot(meta, ctx);
  const fresh = [];
  for (const a of ACHIEVEMENTS) {
    if (meta.achievements.includes(a.id) || !a.test(s)) continue;
    meta.achievements.push(a.id);
    meta.dao = (meta.dao || 0) + a.dao;
    fresh.push(a);
  }
  return fresh;
}

return { newStats, stats, recordKill, recordDrop, bump, snapshot, checkAchievements };
},

"engine/heirloom.js": function () {
// 传承装备：轮回转世时可以带走一件装备到下一世。属性按「同品质的炼气期装备」重新折算，词条保留，
// 每传承一次属性再 +15%，所以越传越强，但开局不会碾压前期
const { growth, SLOTS } = __req("data/equipment.js");

const HEIRLOOM_BONUS = 0.15;

// 候选：身上穿的 + 行囊里的
function heirloomCandidates(p) {
  const worn = SLOTS.map((s) => p.equipment[s]).filter(Boolean).map((item) => ({ item, where: 'worn' }));
  const bag = p.bag.equipment.map((item) => ({ item, where: 'bag' }));
  return [...worn, ...bag];
}

function makeHeirloom(item, player) {
  const realm = item.realm !== undefined ? item.realm : (player.realm || 0);
  const gen = (item.gen || 0) + 1;
  const k = (growth(0) / growth(realm)) * Math.pow(1 + HEIRLOOM_BONUS, gen);
  const stats = {};
  for (const [key, v] of Object.entries(item.stats || {})) {
    if (key === 'crit') stats[key] = v; // 暴击率不随境界放大
    else if (key === 'spd') stats[key] = Math.max(1, Math.round(v / (1 + 0.4 * realm) * Math.pow(1 + HEIRLOOM_BONUS, gen)));
    else stats[key] = Math.max(1, Math.round(v * k));
  }
  return {
    ...JSON.parse(JSON.stringify(item)),
    name: item.name.startsWith('传承·') ? item.name : `传承·${item.name}`,
    stats,
    realm: 0,
    gen,
    heirloom: true,
    price: Math.max(1, Math.round(item.price * k)),
  };
}

return { HEIRLOOM_BONUS, heirloomCandidates, makeHeirloom };
},
"engine/scheduler.js": function () {
const { bandAt } = __req("engine/world.js");
const { MONSTERS } = __req("data/monsters.js");

// 事件调度：按权重在事件表中挑选，when(ctx) 为假的条目被排除
function pickEvent(table, ctx, rng) {
  const pool = table.filter((e) => !e.when || e.when(ctx));
  const total = pool.reduce((sum, e) => sum + e.weight, 0);
  if (!pool.length || total <= 0) return null;
  let r = rng.next() * total;
  for (const e of pool) {
    r -= e.weight;
    if (r < 0) return e;
  }
  return pool[pool.length - 1];
}

// 在事件的怪物列表里挑一只：怪物的 habitat 包含当前区域时，出现概率是其他怪物的 3 倍
const HABITAT_WEIGHT = 3;
function pickMonster(rng, ids, depth) {
  const band = bandAt(depth).id;
  const weights = ids.map((id) => ((MONSTERS[id].habitat || []).includes(band) ? HABITAT_WEIGHT : 1));
  let r = rng.next() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < ids.length; i++) {
    r -= weights[i];
    if (r < 0) return ids[i];
  }
  return ids[ids.length - 1];
}

return { pickEvent, HABITAT_WEIGHT, pickMonster };
},
"engine/save.js": function () {
// 存档：单个键，内含版本号；run（本次修行）与 meta（轮回永久数据）分离
const { legacyToItem, accessorySlotFor } = __req("data/legacyEquipment.js");
const { SLOTS } = __req("data/equipment.js");
const { bandIndexAt } = __req("engine/world.js");
const { realmStageAt } = __req("engine/progress.js");

const SAVE_VERSION = 10;
const SAVE_KEY = 'xiantu:save';

// MIGRATIONS[n] 把 n 版存档转换为 n+1 版。游戏更新存档结构时在这里追加
const MIGRATIONS = {
  // v1 → v2：新增元宝、已学武学、装备、行囊、魂。属性、机制等派生数据由 recomputePlayer 在读取后补算
  1: (save) => {
    const out = { ...save };
    if (out.run && out.run.player) {
      const p = out.run.player;
      if (p.gold === undefined) p.gold = 0;
      if (!Array.isArray(p.learned)) p.learned = [...(p.skills || [])];
      if (!p.equipment) p.equipment = { weapon: null, armor: null, accessory: null };
      if (!p.bag) p.bag = { equipment: [] };
      if (p.souls === undefined) p.souls = 0;
      if (out.run.shop === undefined) out.run.shop = null;
    }
    return out;
  },
  // v2 → v3：装备从固定 id 变成随机生成的实例；武学有了等级。旧装备按原数值转成实例
  // 旧版行商的库存里是固定 id 的装备，无法沿用，直接作废（下次遇到行商会重新生成）
  2: (save) => {
    const out = { ...save };
    if (out.run && out.run.player) {
      const p = out.run.player;
      const conv = (v) => (typeof v === 'string' ? legacyToItem(v) : v);
      if (p.equipment) for (const slot of Object.keys(p.equipment)) p.equipment[slot] = conv(p.equipment[slot]) || null;
      if (p.bag && Array.isArray(p.bag.equipment)) p.bag.equipment = p.bag.equipment.map(conv).filter(Boolean);
      if (!p.skillLevels) {
        p.skillLevels = {};
        for (const id of p.learned || []) p.skillLevels[id] = 1;
      }
      out.run.shop = null;
    }
    return out;
  },
  // v3 → v4：新增修为（xp）。等级 lv 等派生数据由 recomputePlayer 在读取后补算
  3: (save) => {
    const out = { ...save };
    if (out.run && out.run.player && out.run.player.xp === undefined) out.run.player.xp = 0;
    return out;
  },
  // v4 → v5：取消修为，境界完全由层数决定；记录已通关的区域首领数。按层数重算境界，之前走过的区域视为已通关
  4: (save) => {
    const out = { ...save };
    if (out.run && out.run.player) {
      delete out.run.player.xp;
      const depth = out.run.depth || 0;
      out.run.cleared = bandIndexAt(depth);
      const { realm, stage } = realmStageAt(depth);
      out.run.player.realm = realm;
      out.run.player.stage = stage;
    }
    return out;
  },
  // v5 → v6：新增魔界（心魔钥匙、试炼碎片）
  5: (save) => {
    const out = { ...save };
    if (out.run && out.run.player) {
      if (out.run.player.keys === undefined) out.run.player.keys = 0;
      if (!out.run.demon) out.run.demon = { shards: [], won: false, inside: false };
    }
    return out;
  },
  // v6 → v7：装备从 3 个部位扩成 8 个。旧的「饰品」按装备类型归到护符、玉佩、戒指、项链；部位冲突的放回行囊
  6: (save) => {
    const out = { ...save };
    if (out.run && out.run.player) {
      const p = out.run.player;
      const old = p.equipment || {};
      const eq = Object.fromEntries(SLOTS.map((s) => [s, null]));
      if (!p.bag) p.bag = { equipment: [] };
      if (!Array.isArray(p.bag.equipment)) p.bag.equipment = [];
      for (const [slot, item] of Object.entries(old)) {
        if (!item) continue;
        const target = SLOTS.includes(slot) ? slot : accessorySlotFor(item);
        if (eq[target]) {
          item.slot = target;
          p.bag.equipment.push(item);
        } else {
          item.slot = target;
          eq[target] = item;
        }
      }
      for (const item of p.bag.equipment) if (!SLOTS.includes(item.slot)) item.slot = accessorySlotFor(item);
      p.equipment = eq;
      if (Array.isArray(out.run.shop)) {
        for (const e of out.run.shop) if (e.kind === 'equip' && !SLOTS.includes(e.item.slot)) e.item.slot = accessorySlotFor(e.item);
      }
    }
    return out;
  },
  // v7 → v8：新增周目与道果加持。进行中的修行视为第 1 周目，没有道果加成
  7: (save) => {
    const out = { ...save };
    if (out.run) {
      if (!out.run.cycle) out.run.cycle = 1;
      if (out.run.player) {
        if (!out.run.player.cycle) out.run.player.cycle = 1;
        if (!out.run.player.dao) out.run.player.dao = {};
      }
    }
    return out;
  },
  // v8 → v9：武学获得后变成行囊里的「秘籍」，由玩家决定学会/升级还是出售
  8: (save) => {
    const out = { ...save };
    if (out.run && out.run.player) {
      const p = out.run.player;
      if (!p.bag) p.bag = { equipment: [] };
      if (!p.bag.books) p.bag.books = {};
    }
    return out;
  },
  // v9 → v10：新增成就/图鉴统计（meta.stats）、设置、传承装备，以及洞府奇遇的待选状态
  9: (save) => {
    const out = { ...save };
    if (out.run && out.run.cave === undefined) out.run.cave = null;
    if (out.run && out.run.swindle === undefined) out.run.swindle = null;
    return out;
  },
};

function createNewMeta() {
  return { dao: 0, codex: [], achievements: [], unlocks: [], rebirths: 0, endings: 0, cycle: 1, upgrades: {}, best: 0, settings: { caveAuto: false }, heirloom: null };
}

function createNewSave() {
  return { version: SAVE_VERSION, savedAt: 0, run: null, meta: createNewMeta() };
}

function migrate(save, migrations = MIGRATIONS, target = SAVE_VERSION) {
  let cur = { ...save };
  let v = cur.version ?? 0;
  if (v > target) throw new Error('存档版本高于游戏版本，请更新游戏后再读取');
  while (v < target) {
    const fn = migrations[v];
    if (!fn) throw new Error(`缺少 v${v} 的存档迁移函数`);
    cur = fn(cur);
    v += 1;
    cur.version = v;
  }
  cur.meta = { ...createNewMeta(), ...(cur.meta || {}) };
  cur.meta.settings = { ...createNewMeta().settings, ...(cur.meta.settings || {}) };
  if (cur.run === undefined) cur.run = null;
  return cur;
}

function saveGame(storage, save) {
  const out = { ...save, version: SAVE_VERSION, savedAt: Date.now() };
  storage.setItem(SAVE_KEY, JSON.stringify(out));
  return out;
}

// 返回 { save, error }：存档损坏时给出全新存档并附带错误信息，不会擅自覆盖旧数据
function loadGame(storage) {
  const raw = storage.getItem(SAVE_KEY);
  if (!raw) return { save: createNewSave(), error: null };
  try {
    return { save: migrate(JSON.parse(raw)), error: null };
  } catch (e) {
    return { save: createNewSave(), error: e.message };
  }
}

// 轮回/放弃本次修行：只清 run，保留 meta
function clearRun(storage, save) {
  return saveGame(storage, { ...save, run: null });
}

// ---- 导出 / 导入码：JSON → deflate → base64，附校验和 ----
function fnv1a(str) {
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(16).padStart(8, '0');
}

async function pipe(bytes, stream) {
  const writer = stream.writable.getWriter();
  writer.write(bytes);
  writer.close();
  return new Uint8Array(await new Response(stream.readable).arrayBuffer());
}

function toBase64(bytes) {
  let s = '';
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s);
}

function fromBase64(str) {
  const s = atob(str);
  const out = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) out[i] = s.charCodeAt(i);
  return out;
}

async function exportCode(save) {
  const json = JSON.stringify(save);
  const packed = await pipe(new TextEncoder().encode(json), new CompressionStream('deflate-raw'));
  return `XT1.${fnv1a(json)}.${toBase64(packed)}`;
}

async function importCode(code) {
  const parts = String(code).replace(/\s+/g, '').split('.');
  if (parts.length !== 3 || parts[0] !== 'XT1') throw new Error('导入码格式不正确');
  let json;
  try {
    const raw = await pipe(fromBase64(parts[2]), new DecompressionStream('deflate-raw'));
    json = new TextDecoder().decode(raw);
  } catch {
    throw new Error('导入码已损坏');
  }
  if (fnv1a(json) !== parts[1]) throw new Error('导入码校验失败，内容可能被改动');
  return migrate(JSON.parse(json));
}

return { SAVE_VERSION, SAVE_KEY, MIGRATIONS, createNewMeta, createNewSave, migrate, saveGame, loadGame, clearRun, exportCode, importCode };
},

  },
};

// 把旧装备 id 转成新的装备实例（数值保持旧版不变，不再随机）
function legacyToItem(id) {
  const t = LEGACY_EQUIPMENT[id];
  if (!t) return null;
  return {
    uid: `legacy_${id}`,
    tpl: 'legacy',

}

// 旧版有一个「饰品」部位，现在拆成护符、玉佩、戒指、项链。按装备模板（或旧装备名字）判断它该去哪个部位
const ACCESSORY_BY_TPL = { jade: 'jade', pendant: 'necklace', ring: 'ring' };
const ACCESSORY_BY_NAME = { '灵玉佩': 'jade', '聚宝囊': 'talisman', '疾风坠': 'necklace', '吸血珠': 'ring', '龙血石': 'ring' };
function accessorySlotFor(item) {
  return ACCESSORY_BY_TPL[item.tpl] || ACCESSORY_BY_NAME[item.name] || 'talisman';
}

return { LEGACY_EQUIPMENT, legacyToItem, accessorySlotFor };
},
"engine/progress.js": function () {
// 成长：境界完全由层数决定（层数 = 境界）。每个区域对应一个大境界，区域内每走过三分之一是一个小境界。
// 区域的最后一层是关卡：必须击败瓶颈首领，才能进入下一个区域（下一个大境界）。
const { BANDS, BOSS, ENEMY_ATK, ENEMY_EXTRA } = __req("data/world.js");
const { REALMS } = __req("data/realms.js");
const { growth } = __req("data/equipment.js");
const { recomputePlayer } = __req("engine/state.js");
const { bandIndexAt, powerAt } = __req("engine/world.js");

const MAX_REALM = REALMS.length - 1; // 渡劫；之后的无尽仙界境界不再提升

// 层数 → 大境界与小境界（0 前期 / 1 中期 / 2 后期）
function realmStageAt(depth) {
  const i = bandIndexAt(depth);
  if (i > MAX_REALM) return { realm: MAX_REALM, stage: 2 };
  const b = BANDS[i];
  const stage = Math.min(2, Math.floor(((depth - b.from) * 3) / (b.to - b.from)));
  return { realm: b.realm, stage };
}

// 是否正站在区域尽头：下一步就要跨进新区域，而当前区域的首领还没击败
function atGate(run) {
  const i = bandIndexAt(run.depth);
  const b = BANDS[i];
  return b.to !== Infinity && run.depth + 1 >= b.to && (run.cleared || 0) <= i;
}

// 让玩家的境界与当前层数一致。返回 'realm'（大境界提升）、'stage'（小境界提升）或 null
function syncRealm(p, depth) {
  const { realm, stage } = realmStageAt(depth);
  if (realm === p.realm && stage === p.stage) return null;
  const bigUp = realm > p.realm;
  p.realm = realm;
  p.stage = stage;
  recomputePlayer(p);
  if (bigUp) {
    p.hp = p.stats.maxHp;
    p.mp = p.stats.maxMp;
  }
  return bigUp ? 'realm' : 'stage';
}

// 击败区域首领：记一次通关，向前跨进下一个区域，境界随之提升
function advancePastGate(run) {
  run.cleared = (run.cleared || 0) + 1;
  run.depth += 1;
  return syncRealm(run.player, run.depth);
}

// 瓶颈首领：强度相当于下一个境界起点的普通敌人，但生命、攻击高得多
function createBoss(realm, cycle = 1) {
  const f = realm + 1;
  const k = powerAt(f, cycle);
  const s = BOSS.stats;
  return {
    id: `boss_${realm}`,
    name: BOSS.names[Math.min(realm, BOSS.names.length - 1)],
    side: 'enemy',
    icon: BOSS.icon,
    element: BOSS.elements[Math.min(realm, BOSS.elements.length - 1)],
    isBoss: true,
    human: false,
    lv: f,
    gold: [0, 0],
    loot: {},
    stats: {
      maxHp: Math.round(s.maxHp * k), atk: Math.max(1, Math.round(s.atk * k * ENEMY_ATK)), def: Math.round(s.def * k),
      maxMp: Math.round(s.maxMp * (1 + 0.5 * f)), spd: Math.round(s.spd + 2 * f), crit: s.crit, critDmg: s.critDmg,
    },
    hp: Math.round(s.maxHp * k),
    mp: Math.round(s.maxMp * (1 + 0.5 * f)),
    shield: 0,
    skills: [...BOSS.skills],
    effects: [],
    statuses: [],
    items: {},
    flags: { used: {}, stacks: {} },
    dead: false,
  };
}

return { MAX_REALM, realmStageAt, atGate, syncRealm, advancePastGate, createBoss };
},
"engine/rewards.js": function () {
// 奖励：击败敌人的元宝与掉落、宝箱。装备是随机生成的实例，武学可以重复刷出（重复则升级）
const { SKILLS } = __req("data/skills.js");
const { ITEMS } = __req("data/items.js");
const { growth, itemTitle } = __req("data/equipment.js");
const { generateEquipment } = __req("engine/loot.js");
const { addToBag, addBook } = __req("engine/inventory.js");
const { CHEST_GOLD_CHANCE, CHEST_GOLD_RANGE } = __req("engine/economy.js");
const { KEY_DROP_CHANCE } = __req("data/demon.js");

const learnable = () => Object.values(SKILLS).filter((s) => s.price);

function rollRewards(enemy, player, rng) {
  const [lo, hi] = enemy.gold || [0, 0];
  const bonus = (player.mods && player.mods.goldMul) || 0;
  const gold = Math.round(rng.int(lo, hi) * (1 + bonus));
  const drops = [];
  const loot = enemy.loot || {};
  if (loot.equip && rng.chance(loot.equip)) drops.push({ kind: 'equip', item: generateEquipment(rng, player.realm || 0) });
  if (loot.skill && rng.chance(loot.skill)) drops.push({ kind: 'skill', id: rng.pick(learnable()).id }); // 不排除已学会的
  if (loot.item && rng.chance(loot.item)) drops.push({ kind: 'item', id: rng.chance(0.5) ? 'hp_pill' : 'mp_pill' });
  if (enemy.human && rng.chance(KEY_DROP_CHANCE)) drops.push({ kind: 'key' }); // 魔修有几率掉落心魔钥匙
  return { gold, drops };
}

// 宝箱：元宝 35%、装备 30%、武学 15%、药品 20%。装备品质看境界，元宝随境界放大
function rollChest(rng, player) {
  const realm = player.realm || 0;
  const x = rng.next();
  if (x < CHEST_GOLD_CHANCE) {
    const bonus = (player.mods && player.mods.goldMul) || 0;
    return { gold: Math.round(rng.int(CHEST_GOLD_RANGE[0], CHEST_GOLD_RANGE[1]) * growth(realm) * (1 + bonus)), drops: [], chest: true };
  }
  if (x < 0.65) return { gold: 0, drops: [{ kind: 'equip', item: generateEquipment(rng, realm) }], chest: true };
  if (x < 0.8) return { gold: 0, drops: [{ kind: 'skill', id: rng.pick(learnable()).id }], chest: true };
  return { gold: 0, drops: [{ kind: 'item', id: rng.chance(0.5) ? 'hp_pill' : 'mp_pill', count: rng.int(1, 2) }], chest: true };
}

// 把奖励结算到玩家身上，返回一段文字，如「获得元宝 12；掉落：[白]粗制剑、武学「御剑诀」升至 Lv.2」
// opts.onItem(item)：每得到一件装备时回调（记录掉落、弹提示用）。装备只放进行囊，不会自动穿上
function applyRewards(player, rewards, opts = {}) {
  const parts = [];
  if (rewards.gold > 0) parts.push(`获得元宝 ${rewards.gold}`);
  player.gold += rewards.gold;
  const texts = [];
  for (const d of rewards.drops) {
    if (d.kind === 'equip') {
      const r = addToBag(player, d.item);
      if (opts.onItem) opts.onItem(d.item);
      const note = r.stored ? '' : `（行囊已满，折算 ${r.gold} 元宝）`;
      texts.push(`${itemTitle(d.item)}${note}`);
    } else if (d.kind === 'key') {
      player.keys = (player.keys || 0) + 1;
      texts.push('「心魔钥匙」');
    } else if (d.kind === 'skill') {
      addBook(player, d.id);
      texts.push(`武学秘籍《${SKILLS[d.id].name}》（已放入行囊）`);
    } else {
      const n = d.count || 1;
      player.items[d.id] = (player.items[d.id] || 0) + n;
      texts.push(`「${ITEMS[d.id].name}」${n > 1 ? ` ×${n}` : ''}`);
    }
  }
  if (texts.length) parts.push(`${rewards.chest ? '宝箱里是' : '掉落'}：${texts.join('、')}`);
  return parts.join('；') || '什么也没有';
}

return { rollRewards, rollChest, applyRewards };
},

"engine/shop.js": function () {
// 行商：每次遇到都随机生成 3 件装备（品质看境界、数值随机）、2 本武学秘籍（买回去自己决定学会/升级还是卖掉）和限量药品。也收购行囊里的装备、秘籍、已学武学和丹药。
// 库存存进 run.shop，刷新页面不会重新刷货
const { SKILLS, SKILL_MAX_LEVEL } = __req("data/skills.js");
const { ITEMS } = __req("data/items.js");
const { BAG_MAX, itemTitle } = __req("data/equipment.js");
const { generateEquipment, skillPrice, pillPrice } = __req("engine/loot.js");
const { bagFull, addBook, skillLevel } = __req("engine/inventory.js");

const PILL_STOCK = 3;

function pickN(rng, arr, n) {
  const pool = [...arr];
  const out = [];
  while (out.length < n && pool.length) out.push(pool.splice(rng.int(0, pool.length - 1), 1)[0]);
  return out;
}

// opts.loyalty：老主顾折扣（九五折、九折）
function generateShop(rng, player, opts = {}) {
  const realm = player.realm || 0;
  const discount = ((player.mods && player.mods.shopDiscount) || 1) * (opts.loyalty || 1);
  const price = (base) => Math.max(1, Math.round(base * discount));
  const equip = Array.from({ length: 3 }, () => {
    const item = generateEquipment(rng, realm);
    return { kind: 'equip', item, price: price(item.price), sold: false };
  });
  const skills = pickN(rng, Object.values(SKILLS).filter((s) => s.price), 2).map((s) => ({
    kind: 'skill', id: s.id, price: price(skillPrice(s, realm)), sold: false, // 不排除已学会的：重复购买可升级
  }));
  const items = Object.values(ITEMS).map((i) => ({
    kind: 'item', id: i.id, price: price(pillPrice(i, realm)), stock: PILL_STOCK, sold: false,
  }));
  return [...equip, ...skills, ...items];
}

function shopEntryName(entry) {
  if (entry.kind === 'equip') return entry.item.name;
  if (entry.kind === 'skill') return SKILLS[entry.id].name;
  return ITEMS[entry.id].name;
}

function buyFromShop(player, shop, index) {
  const entry = shop[index];
  if (!entry) return { ok: false, msg: '没有这件商品' };
  if (entry.sold) return { ok: false, msg: '已售罄' };
  if (entry.kind === 'equip' && bagFull(player)) return { ok: false, msg: `行囊已满（${BAG_MAX} 件），先整理一下` };
  if (entry.kind === 'skill' && skillLevel(player, entry.id) >= SKILL_MAX_LEVEL) return { ok: false, msg: '这门武学已经满级了' };
  if (player.gold < entry.price) return { ok: false, msg: '元宝不足' };
  player.gold -= entry.price;
  let what;
  if (entry.kind === 'equip') {
    player.bag.equipment.push(entry.item);
    entry.sold = true;
    what = `购买了${itemTitle(entry.item)}，已放入行囊`;
  } else if (entry.kind === 'skill') {
    addBook(player, entry.id);
    entry.sold = true;
    what = `购买了武学秘籍《${SKILLS[entry.id].name}》，已放入行囊（在行囊里选择学习或出售）`;
  } else {
    player.items[entry.id] = (player.items[entry.id] || 0) + 1;
    entry.stock -= 1;
    if (entry.stock <= 0) entry.sold = true;
    what = `购买了「${ITEMS[entry.id].name}」`;
  }
  return { ok: true, msg: `${what}，花费 ${entry.price} 元宝` };
}

return { generateShop, shopEntryName, buyFromShop };
},
"engine/demon.js": function () {
// 魔界：试炼敌人按玩家当前等级生成，所以任何时候进来难度都合适；钥匙、碎片、召唤终局首领、奖励
const { TRIALS, FINAL, TRIAL_BASE, FINAL_BASE, TRIAL_POWER, FINAL_POWER, SHARDS_NEEDED, DEFEAT_HP_RATIO } = __req("data/demon.js");
const { ENEMY_ATK, ENEMY_EXTRA } = __req("data/world.js");
const { growth } = __req("data/equipment.js");
const { generateEquipment } = __req("engine/loot.js");
const { cycleMul } = __req("engine/world.js");

const trialById = (id) => TRIALS.find((t) => t.id === id);

function build(base, tpl, player, power) {
  const lv = player.lv || 0;
  const k = growth(lv) * (1 + ENEMY_EXTRA * lv) * power * cycleMul(player.cycle || 1);
  const maxHp = Math.round(base.maxHp * k);
  const maxMp = Math.round(base.maxMp * (1 + 0.5 * lv));
  return {
    id: `demon_${tpl.id}`,
    name: tpl.title || tpl.name,
    side: 'enemy',
    icon: tpl.icon,
    element: tpl.element,
    human: false,
    lv,
    gold: [0, 0],
    loot: {},
    isTrial: true,
    trialId: tpl.id,
    rule: tpl.rule,
    stats: {
      maxHp, atk: Math.max(1, Math.round(base.atk * k * ENEMY_ATK)), def: Math.round(base.def * k), maxMp,
      spd: Math.round(base.spd + 2 * lv), crit: base.crit, critDmg: base.critDmg,
    },
    hp: maxHp,
    mp: maxMp,
    shield: 0,
    skills: [...tpl.skills],
    effects: [],
    statuses: [],
    items: {},
    flags: { used: {}, stacks: {} },
    dead: false,
  };
}

const createTrialEnemy = (trial, player) => build(TRIAL_BASE, trial, player, TRIAL_POWER);
const createFinalBoss = (player) => ({ ...build(FINAL_BASE, FINAL, player, FINAL_POWER), name: FINAL.name, isFinal: true });

// 进入魔界：消耗一把心魔钥匙。没有钥匙返回 false
function enterDemon(player, run) {
  if (!(player.keys > 0)) return false;
  player.keys -= 1;
  run.demon.inside = true;
  return true;
}

function leaveDemon(run) {
  run.demon.inside = false;
}

// 魔界里挑战失败：不会死。这次试炼没有奖励，被击退并逃出魔界，生命恢复到 30%。返回恢复后的生命
function defeatInDemon(run) {
  const p = run.player;
  p.dead = false;
  p.shield = 0;
  p.statuses = [];
  p.hp = Math.max(1, Math.round(p.stats.maxHp * DEFEAT_HP_RATIO));
  run.demon.inside = false;
  return p.hp;
}

const trialCleared = (run, id) => run.demon.shards.includes(id);
const canSummon = (run) => run.demon.shards.length >= SHARDS_NEEDED && !run.demon.won;

// 通过试炼：记一块碎片（同一个试炼只记一次）
function clearTrial(run, id) {
  if (!run.demon.shards.includes(id)) run.demon.shards.push(id);
}

// 试炼与终局首领的奖励：元宝 + 装备（试炼至少蓝品；终局 2 件，至少黄品）
function demonRewards(player, rng, isFinal) {
  const realm = player.realm || 0;
  if (isFinal) {
    return {
      gold: Math.round(600 * growth(realm)),
      drops: [
        { kind: 'equip', item: generateEquipment(rng, realm, { minRarity: 'legendary' }) },
        { kind: 'equip', item: generateEquipment(rng, realm, { minRarity: 'legendary' }) },
      ],
    };
  }
  return {
    gold: Math.round(60 * growth(realm)),
    drops: [{ kind: 'equip', item: generateEquipment(rng, realm, { minRarity: 'rare' }) }],
  };
}

return { trialById, createTrialEnemy, createFinalBoss, enterDemon, leaveDemon, defeatInDemon, trialCleared, canSummon, clearTrial, demonRewards };
},
"combat/battle.js": function () {
const { SKILLS } = __req("data/skills.js");
const { canAct, consumeSkip, getStat, tickEnd } = __req("combat/status.js");
const { applyDamage, emit, fireTrigger, runOp } = __req("combat/effects.js");
const { canAfford, useItem, useSkill } = __req("combat/skills.js");
const { chooseEnemyAction } = __req("combat/autoplay.js");
const { initRule, ruleTurnStart, ruleTurnEnd, ruleInterrupt } = __req("combat/rules.js");

// rule：魔界试炼等特殊战斗的规则名（见 combat/rules.js），普通战斗为 null
function createBattle({ player, enemy, rng, rule = null }) {
  const battle = { turn: 1, player, enemy, rng, log: [], over: false, winner: null, _depth: 0, rule };
  emit(battle, `遭遇 ${enemy.name}！`, { kind: 'info' });
  initRule(battle);
  return battle;
}

function checkOver(battle) {
  if (battle.over) return;
  if (battle.player.dead) {
    battle.over = true;
    battle.winner = 'enemy';
    emit(battle, `你被 ${battle.enemy.name} 击败了……`, { kind: 'end' });
  } else if (battle.enemy.dead) {
    battle.over = true;
    battle.winner = 'player';
    emit(battle, `你击败了 ${battle.enemy.name}！`, { kind: 'end' });
  }
}

function perform(battle, actor, foe, action) {
  switch (action.type) {
    case 'skill': {
      const skill = SKILLS[action.skillId];
      if (skill && actor.skills.includes(action.skillId) && canAfford(actor, action.skillId)) {
        useSkill(battle, actor, foe, skill);
        return;
      }
      emit(battle, `${actor.name} 灵力不足，改为普攻`, { kind: 'info' });
      useSkill(battle, actor, foe, SKILLS.basic);
      return;
    }
    case 'item':
      if (useItem(battle, actor, action.itemId)) return;
      emit(battle, `${actor.name} 没有可用的丹药，改为普攻`, { kind: 'info' });
      useSkill(battle, actor, foe, SKILLS.basic);
      return;
    default:
      useSkill(battle, actor, foe, SKILLS.basic);
  }
}

function endTurn(battle) {
  for (const unit of [battle.player, battle.enemy]) {
    if (unit.dead) continue;
    const foe = unit === battle.player ? battle.enemy : battle.player;
    const { dots } = tickEnd(unit);
    for (const d of dots) {
      applyDamage(battle, unit, d.amount, null);
      emit(battle, `${unit.name} 受「${d.name}」折磨，损失 ${d.amount} 点生命`, { kind: 'damage', target: unit.side });
      if (unit.dead) break;
    }
    if (!unit.dead) {
      runOp(battle, { op: 'mp', pct: 0.05 }, unit, null);
      fireTrigger(battle, 'turnEnd', unit, foe);
    }
    checkOver(battle);
    if (battle.over) return;
  }
  ruleTurnEnd(battle);
  checkOver(battle);
  if (battle.over) return;
  battle.turn += 1;
}

// 推进一个回合：双方按速度依次行动，playerAction 为玩家本回合选择
function step(battle, playerAction) {
  if (battle.over) return battle;
  const { player, enemy } = battle;
  ruleTurnStart(battle);
  checkOver(battle);
  if (battle.over) return battle;
  const order = getStat(enemy, 'spd') > getStat(player, 'spd') ? [enemy, player] : [player, enemy];
  for (const actor of order) {
    if (battle.over) break;
    if (actor.dead) continue;
    const foe = actor === player ? enemy : player;
    fireTrigger(battle, 'turnStart', actor, foe);
    if (!canAct(actor)) {
      const name = consumeSkip(actor);
      emit(battle, `${actor.name} 被「${name}」所困，无法行动`, { kind: 'info' });
    } else if (ruleInterrupt(battle, actor)) {
      // 被惊扰打断，本回合无法行动
    } else {
      perform(battle, actor, foe, actor === player ? playerAction : chooseEnemyAction(battle));
    }
    checkOver(battle);
  }
  if (!battle.over) endTurn(battle);
  return battle;
}

return { createBattle, step };
},
"combat/status.js": function () {
// 状态系统：纯函数，不依赖其他模块
const STATUS_DEFS = {
  burn: { name: '灼烧', dotPct: 0.05 },
  poison: { name: '中毒', dotPct: 0.04 },
  freeze: { name: '冰封', skip: true },
  root: { name: '定身', skip: true },
  buff: { name: '增益' },
};

function applyStatus(unit, id, turns, extra = {}) {
  const existing = unit.statuses.find((s) => s.id === id && s.stat === extra.stat);
  if (existing) {
    existing.turns = Math.max(existing.turns, turns);
    Object.assign(existing, extra);
  } else {
    unit.statuses.push({ id, turns, ...extra });
  }
}

function hasStatus(unit, id) {
  return unit.statuses.some((s) => s.id === id);
}

function canAct(unit) {
  return !unit.statuses.some((s) => STATUS_DEFS[s.id] && STATUS_DEFS[s.id].skip);
}

// 因冰封/定身跳过行动时消耗一回合，返回状态名（没有则返回 null）
function consumeSkip(unit) {
  const s = unit.statuses.find((x) => STATUS_DEFS[x.id] && STATUS_DEFS[x.id].skip);
  if (!s) return null;
  s.turns -= 1;
  if (s.turns <= 0) unit.statuses.splice(unit.statuses.indexOf(s), 1);
  return STATUS_DEFS[s.id].name;
}

function getStat(unit, name) {
  let value = unit.stats[name];
  for (const s of unit.statuses) {
    if (s.id === 'buff' && s.stat === name) value *= s.mul;
  }
  return value;
}

// 回合结束：返回持续伤害，并递减回合（跳过类状态不在这里递减）
function tickEnd(unit) {
  const dots = [];
  for (const s of unit.statuses) {
    const def = STATUS_DEFS[s.id];
    if (def && def.dotPct) {
      dots.push({ id: s.id, name: def.name, amount: Math.max(1, Math.round(unit.stats.maxHp * def.dotPct)) });
    }
  }
  const expired = [];
  unit.statuses = unit.statuses.filter((s) => {
    const def = STATUS_DEFS[s.id];
    if (def && def.skip) return true;
    s.turns -= 1;
    if (s.turns <= 0) {
      expired.push(s.id);
      return false;
    }
    return true;
  });
  return { dots, expired };
}

return { STATUS_DEFS, applyStatus, hasStatus, canAct, consumeSkip, getStat, tickEnd };
},
"combat/effects.js": function () {
// 效果引擎：装备/功法/被动都用数据声明 {on, chance, do:{op,...}}，在这里统一执行
const { applyStatus, getStat, STATUS_DEFS } = __req("combat/status.js");

const STAT_NAMES = { atk: '攻击', def: '防御', spd: '身法', crit: '暴击' };
const MAX_DEPTH = 3; // 触发链最大深度，防止互相反伤导致死循环

function emit(battle, text, extra = {}) {
  if (battle && battle.log) battle.log.push({ text, ...extra });
}

function pickUnit(ctx, params, fallback) {
  return (params.who || fallback) === 'self' ? ctx.source : ctx.target;
}

const OPS = {
  heal(ctx, p) {
    const unit = pickUnit(ctx, p, 'self');
    if (!unit || unit.dead) return;
    let amount;
    if (p.flat !== undefined) amount = p.flat;
    else if (p.pctOfDealt !== undefined) amount = Math.round((ctx.extra.dealt || 0) * p.pctOfDealt);
    else amount = Math.round(unit.stats.maxHp * (p.pct || 0));
    const before = unit.hp;
    unit.hp = Math.min(unit.stats.maxHp, unit.hp + amount);
    const gained = unit.hp - before;
    if (gained > 0) emit(ctx.battle, `${unit.name} 恢复了 ${gained} 点生命`, { kind: 'heal' });
  },
  mp(ctx, p) {
    const unit = pickUnit(ctx, p, 'self');
    if (!unit || unit.dead) return;
    const amount = p.flat !== undefined ? p.flat : Math.round(unit.stats.maxMp * (p.pct || 0));
    const before = unit.mp;
    unit.mp = Math.min(unit.stats.maxMp, unit.mp + amount);
    if (unit.mp > before) emit(ctx.battle, `${unit.name} 回复了 ${unit.mp - before} 点灵力`, { kind: 'mp' });
  },
  damage(ctx, p) {
    const unit = pickUnit(ctx, p, 'foe');
    if (!unit || unit.dead) return;
    const amount = p.flat !== undefined ? p.flat : Math.round(getStat(ctx.source, 'atk') * (p.pct || 0));
    const dealt = applyDamage(ctx.battle, unit, amount, ctx.source);
    emit(ctx.battle, `${ctx.source.name} 的效果令 ${unit.name} 受到 ${dealt} 点伤害`, { kind: 'damage' });
  },
  status(ctx, p) {
    const unit = pickUnit(ctx, p, 'foe');
    if (!unit || unit.dead) return;
    applyStatus(unit, p.id, p.turns || 1);
    const def = STATUS_DEFS[p.id];
    emit(ctx.battle, `${unit.name} 陷入「${def ? def.name : p.id}」`, { kind: 'status' });
  },
  shield(ctx, p) {
    const unit = pickUnit(ctx, p, 'self');
    if (!unit || unit.dead) return;
    const amount = Math.round(unit.stats.maxHp * (p.pct || 0));
    unit.shield += amount;
    emit(ctx.battle, `${unit.name} 获得 ${amount} 点护盾`, { kind: 'shield' });
  },
  buff(ctx, p) {
    const unit = pickUnit(ctx, p, 'self');
    if (!unit || unit.dead) return;
    applyStatus(unit, 'buff', p.turns || 1, { stat: p.stat, mul: p.mul });
    emit(ctx.battle, `${unit.name} 的${STAT_NAMES[p.stat] || p.stat}提升`, { kind: 'buff' });
  },
  // 叠层（如剑修的剑意）：每次 +1，最多 max 层。层数存在 unit.flags.stacks，每场战斗开始清零
  stack(ctx, p) {
    const unit = pickUnit(ctx, p, 'self');
    if (!unit || unit.dead) return;
    if (!unit.flags.stacks) unit.flags.stacks = {};
    const before = unit.flags.stacks[p.key] || 0;
    const n = Math.min(p.max || 99, before + 1);
    unit.flags.stacks[p.key] = n;
    if (n !== before) emit(ctx.battle, `${unit.name} 的${p.label || p.key}叠至 ${n} 层`, { kind: 'buff' });
  },
  // 存魂（鬼修）：unit.souls 跨战斗保留，最多 max
  soul(ctx, p) {
    const unit = pickUnit(ctx, p, 'self');
    if (!unit) return;
    const before = unit.souls || 0;
    unit.souls = Math.min(p.max || 10, before + (p.n || 1));
    if (unit.souls > before) emit(ctx.battle, `${unit.name} 吞噬一缕魂魄（${unit.souls}）`, { kind: 'buff' });
  },
  revive(ctx, p) {
    const unit = ctx.source;
    if (unit.hp > 0) return;
    unit.hp = Math.max(1, Math.round(unit.stats.maxHp * (p.pct || 0.3)));
    emit(ctx.battle, `${unit.name} 复生了！`, { kind: 'revive' });
  },
};

function runOp(battle, spec, source, target, extra = {}) {
  const fn = OPS[spec.op];
  if (!fn) throw new Error(`未知效果 op: ${spec.op}`);
  fn({ battle, source, target, extra }, spec);
}

// 触发 source 身上所有挂在 trigger 上的效果
function fireTrigger(battle, trigger, source, target, extra = {}) {
  if (!source || !source.effects) return;
  const depth = battle._depth || 0;
  if (depth >= MAX_DEPTH) return;
  battle._depth = depth + 1;
  try {
    for (const eff of source.effects) {
      if (eff.on !== trigger) continue;
      if (eff.once && eff.id && source.flags.used[eff.id]) continue;
      if (eff.if && eff.if.hpBelow !== undefined && !(source.hp / source.stats.maxHp < eff.if.hpBelow)) continue;
      if (eff.chance !== undefined && !battle.rng.chance(eff.chance)) continue;
      if (eff.once && eff.id) source.flags.used[eff.id] = true;
      runOp(battle, eff.do, source, target, extra);
    }
  } finally {
    battle._depth = depth;
  }
}

// 统一的扣血入口：先扣护盾，再触发受击/死亡/击杀。返回实际扣掉的生命
function applyDamage(battle, unit, amount, source) {
  if (unit.dead) return 0;
  let dmg = Math.max(0, Math.round(amount));
  if (unit.shield > 0 && dmg > 0) {
    const absorbed = Math.min(unit.shield, dmg);
    unit.shield -= absorbed;
    dmg -= absorbed;
  }
  const before = unit.hp;
  unit.hp = Math.max(0, unit.hp - dmg);
  const dealt = before - unit.hp;
  if (unit.hp > 0) {
    if (dealt > 0 && source) fireTrigger(battle, 'hit', unit, source, { taken: dealt });
    return dealt;
  }
  fireTrigger(battle, 'death', unit, source);
  if (unit.hp > 0) return dealt; // 被复生
  unit.dead = true;
  if (source && source !== unit) fireTrigger(battle, 'kill', source, unit);
  return dealt;
}

return { emit, OPS, runOp, fireTrigger, applyDamage };
},
"combat/skills.js": function () {
const { SKILLS, levelMul } = __req("data/skills.js");
const { ITEMS } = __req("data/items.js");
const { elementMultiplier } = __req("engine/elements.js");
const { getStat } = __req("combat/status.js");
const { applyDamage, fireTrigger, runOp, emit } = __req("combat/effects.js");
const { ruleMiss, ruleOnItem, ruleNeutralElements } = __req("combat/rules.js");

// 灵力消耗：使用本宗门擅长类型的武学时 ×0.8（向上取整）
function skillCost(unit, skill) {
  if (skill.tag && unit.affinity && skill.tag === unit.affinity) return Math.ceil(skill.mp * 0.8);
  return skill.mp;
}

function canAfford(unit, skillId) {
  const s = SKILLS[skillId];
  return !!s && unit.mp >= skillCost(unit, s);
}

// 列出某个单位当前可选的行动（供界面渲染）：普攻、武学、丹药
function listActions(unit) {
  const acts = [{ type: 'attack', affordable: true }];
  for (const id of unit.skills) {
    acts.push({ type: 'skill', skillId: id, affordable: canAfford(unit, id), cost: skillCost(unit, SKILLS[id]) });
  }
  for (const [id, n] of Object.entries(unit.items)) {
    if (n > 0) acts.push({ type: 'item', itemId: id, count: n, affordable: true });
  }
  return acts;
}

function calcDamage(battle, attacker, defender, skill) {
  const atk = getStat(attacker, 'atk');
  // 防御按防守方的等级归一化：防御与攻击同步放大时，减伤比例保持不变（否则高等级下敌人的伤害会被「饱和」）
  const def = getStat(defender, 'def') / Math.pow(1.7, defender.lv || 0);
  const element = skill.element === 'self' ? attacker.element : skill.element;
  const elemMul = ruleNeutralElements(battle) ? 1 : elementMultiplier(element, defender.element);
  const variance = 0.9 + battle.rng.next() * 0.2;
  const crit = battle.rng.chance(getStat(attacker, 'crit'));
  // 同源：功法自带元素与使用者灵根相同时威力 +20%
  const sameSource = skill.element !== 'self' && skill.element === attacker.element ? 1.2 : 1;
  // 擅长：宗门擅长类型的武学威力 +15%
  const affinity = skill.tag && attacker.affinity === skill.tag ? 1.15 : 1;
  // 宗门独门机制：剑意叠层、鬼修存魂加成攻击
  const am = attacker.mods || {};
  let bonus = 1;
  if (am.stackDamage) {
    for (const [key, per] of Object.entries(am.stackDamage)) bonus += per * ((attacker.flags.stacks && attacker.flags.stacks[key]) || 0);
  }
  if (am.soulAtk) bonus += am.soulAtk * (attacker.souls || 0);
  // 体修：低血量时受到的伤害降低
  const low = defender.mods && defender.mods.lowHp;
  const taken = low && defender.hp / defender.stats.maxHp < low.below ? low.takenMul : 1;
  // 武学等级：每级威力 +10%
  const level = levelMul((attacker.skillLevels && attacker.skillLevels[skill.id]) || 1);
  let dmg = ((atk * skill.power * level * 100) / (100 + def)) * elemMul * sameSource * affinity * bonus * taken * variance;
  if (crit) dmg *= attacker.stats.critDmg;
  return { amount: Math.max(1, Math.round(dmg)), crit, elemMul };
}

function useSkill(battle, actor, target, skill) {
  let cost = skillCost(actor, skill);
  const fc = actor.mods && actor.mods.freeCast;
  if (fc && skill.tag === fc.tag && cost > 0 && battle.rng.chance(fc.chance)) {
    cost = 0;
    emit(battle, `${actor.name} 符意不绝，这次不消耗灵力`, { kind: 'buff' });
  }
  actor.mp -= cost;
  if (skill.power === 0 && actor.flags.stacks) actor.flags.stacks = {}; // 辅助武学打断叠层
  if (skill.power > 0 && ruleMiss(battle, actor)) return; // 魔界·妄思：攻击落在幻象上
  let dealt = 0;
  if (skill.power > 0) {
    const { amount, crit, elemMul } = calcDamage(battle, actor, target, skill);
    dealt = applyDamage(battle, target, amount, actor);
    const note = elemMul > 1 ? '（五行克制）' : elemMul < 1 ? '（被五行克制）' : '';
    emit(
      battle,
      `${actor.name} ${skill.id === 'basic' ? '发动攻击' : `施展「${skill.name}」`}，${crit ? '暴击！' : ''}对 ${target.name} 造成 ${amount} 点伤害${note}`,
      { kind: 'damage', crit, target: target.side },
    );
    fireTrigger(battle, 'attack', actor, target, { dealt });
  } else {
    emit(battle, `${actor.name} 施展「${skill.name}」`, { kind: 'cast' });
  }
  for (const t of skill.then || []) {
    if (t.chance !== undefined && !battle.rng.chance(t.chance)) continue;
    runOp(battle, t.do, actor, target, { dealt });
  }
}

function useItem(battle, actor, itemId) {
  const item = ITEMS[itemId];
  if (!item || !(actor.items[itemId] > 0)) return false;
  actor.items[itemId] -= 1;
  if (actor.flags.stacks) actor.flags.stacks = {}; // 吃药打断叠层
  const power = (actor.mods && actor.mods.itemPower) || 1; // 丹修：药效提升
  const spec = { ...item.do };
  if (spec.pct !== undefined) spec.pct *= power;
  emit(battle, `${actor.name} 服用了「${item.name}」`, { kind: 'cast' });
  runOp(battle, spec, actor, null);
  ruleOnItem(battle, actor);
  return true;
}

return { skillCost, canAfford, listActions, calcDamage, useSkill, useItem };
},
"engine/elements.js": function () {
const ELEMENTS = ['金', '木', '水', '火', '土', '雷', '冰', '风', '暗'];

// 五行相克：key 克制 value
const COUNTERS = { 金: '木', 木: '土', 土: '水', 水: '火', 火: '金' };

function elementMultiplier(attack, defend) {
  if (COUNTERS[attack] === defend) return 1.3;
  if (COUNTERS[defend] === attack) return 0.75;
  return 1;
}

return { ELEMENTS, COUNTERS, elementMultiplier };
},
"combat/rules.js": function () {
// 战斗规则：魔界七情试炼与天道代行者的主题机制。battle.rule 指定规则名，没有规则时所有钩子都什么也不做
const { applyStatus } = __req("combat/status.js");
const { applyDamage, emit } = __req("combat/effects.js");

const RULE_INFO = {
  joy: { name: '狂喜', desc: '每回合随机获得一项增益，同时附带一项随机反噬' },
  wrath: { name: '暴怒', desc: '你的攻击翻倍，防御归零' },
  worry: { name: '忧虑', desc: '每回合流失 15% 最大灵力' },
  illusion: { name: '妄思', desc: '35% 的攻击会落在幻象上' },
  grief: { name: '悲恸', desc: '每回合损失生命上限的一部分，逐回合递增' },
  fear: { name: '恐惧', desc: '敌人数值被隐藏，且暴击率 +25%' },
  shock: { name: '惊魂', desc: '每回合 30% 概率行动被打断；吃丹药获得定心' },
  tiandao: { name: '天道', desc: '劫雷、规则篡改、道心审判三个阶段' },
};

const active = (battle) => !!(battle && battle.rule);

// 战斗开始时的初始化（上状态、改数值）
function initRule(battle) {
  if (!active(battle)) return;
  const { player: p, enemy: e, rule } = battle;
  if (rule === 'wrath') {
    applyStatus(p, 'buff', 999, { stat: 'atk', mul: 2 });
    applyStatus(p, 'buff', 999, { stat: 'def', mul: 0 });
    emit(battle, '怒火中烧：你的攻击翻倍，但防御归零！', { kind: 'info' });
  } else if (rule === 'fear') {
    e.stats.crit += 0.25;
    emit(battle, '恐惧笼罩着你，看不清对手的虚实……', { kind: 'info' });
  } else if (rule === 'tiandao') {
    e.flags.phase = 1;
    emit(battle, '天道降临，劫云在头顶翻涌。', { kind: 'info' });
  } else if (rule === 'shock') {
    emit(battle, '惊魂未定：你随时可能被打断，吃丹药可以安定心神。', { kind: 'info' });
  }
}

function joyTurn(battle) {
  const { player: p, enemy: e } = battle;
  const boons = [
    () => { applyStatus(p, 'buff', 2, { stat: 'atk', mul: 1.5 }); emit(battle, '狂喜：你的攻击提升了 50%！', { kind: 'buff' }); },
    () => { applyStatus(p, 'buff', 2, { stat: 'crit', mul: 5 }); emit(battle, '狂喜：你的暴击率大幅提升！', { kind: 'buff' }); },
    () => {
      const heal = Math.round(p.stats.maxHp * 0.12);
      p.hp = Math.min(p.stats.maxHp, p.hp + heal);
      emit(battle, `狂喜：你恢复了 ${heal} 点生命！`, { kind: 'heal' });
    },
  ];
  const banes = [
    () => {
      const loss = Math.round(p.stats.maxHp * 0.08);
      applyDamage(battle, p, loss, null);
      emit(battle, `乐极生悲：你损失了 ${loss} 点生命。`, { kind: 'damage', target: 'player' });
    },
    () => { applyStatus(e, 'buff', 2, { stat: 'atk', mul: 1.3 }); emit(battle, '乐极生悲：敌人的攻击提升了 30%！', { kind: 'damage' }); },
    () => {
      const loss = Math.round(p.stats.maxMp * 0.15);
      p.mp = Math.max(0, p.mp - loss);
      emit(battle, `乐极生悲：你流失了 ${loss} 点灵力。`, { kind: 'damage' });
    },
  ];
  battle.rng.pick(boons)();
  battle.rng.pick(banes)();
}

function drainMp(battle, pct, label) {
  const p = battle.player;
  const loss = Math.min(p.mp, Math.round(p.stats.maxMp * pct));
  if (loss > 0) {
    p.mp -= loss;
    emit(battle, `${label}：你流失了 ${loss} 点灵力。`, { kind: 'damage' });
  }
}

function griefLoss(battle, pct, label) {
  const p = battle.player;
  const loss = Math.max(1, Math.round(p.stats.maxHp * pct));
  applyDamage(battle, p, loss, null);
  emit(battle, `${label}：你损失了 ${loss} 点生命。`, { kind: 'damage', target: 'player' });
}

// 每回合开始
function ruleTurnStart(battle) {
  if (!active(battle)) return;
  if (battle.rule === 'joy') joyTurn(battle);
  if (battle.rule === 'tiandao' && battle.turn % 4 === 0) {
    const loss = Math.round(battle.player.stats.maxHp * 0.08);
    applyDamage(battle, battle.player, loss, null);
    emit(battle, `劫雷落下，你受到 ${loss} 点真实伤害！`, { kind: 'damage', target: 'player' });
  }
}

// 每回合结束
function ruleTurnEnd(battle) {
  if (!active(battle)) return;
  const { rule, enemy: e } = battle;
  if (rule === 'worry') drainMp(battle, 0.15, '忧虑缠身');
  if (rule === 'grief') griefLoss(battle, Math.min(0.3, 0.02 + 0.005 * (battle.turn - 1)), '悲从中来');
  if (rule === 'tiandao') {
    const ratio = e.hp / e.stats.maxHp;
    const phase = ratio <= 0.33 ? 3 : ratio <= 0.66 ? 2 : 1;
    if (phase > (e.flags.phase || 1)) {
      e.flags.phase = phase;
      if (phase === 2) emit(battle, '天道：规则篡改——你的五行克制失效，它周身浮现护盾。', { kind: 'info' });
      if (phase === 3) {
        applyStatus(e, 'buff', 999, { stat: 'atk', mul: 1.6 });
        emit(battle, '天道：道心审判——它的攻击暴涨，心魔缠绕着你。', { kind: 'info' });
      }
    }
    if ((e.flags.phase || 1) >= 2 && battle.turn % 3 === 0) {
      const sh = Math.round(e.stats.maxHp * 0.08);
      e.shield += sh;
      emit(battle, `天道获得了 ${sh} 点护盾。`, { kind: 'shield' });
    }
    if (e.flags.phase === 3) {
      const roll = battle.rng.int(0, 2);
      if (roll === 0) drainMp(battle, 0.1, '心魔·忧');
      else if (roll === 1) griefLoss(battle, 0.04, '心魔·悲');
      else if (battle.player.mp > 0) drainMp(battle, 0.05, '心魔·惧');
    }
  }
}

// 行动前：返回 true 表示这次行动被打断
function ruleInterrupt(battle, actor) {
  if (!active(battle) || battle.rule !== 'shock' || actor !== battle.player) return false;
  if (!battle.rng.chance(0.3)) return false;
  const calm = (actor.flags.stacks && actor.flags.stacks.calm) || 0;
  if (calm > 0) {
    actor.flags.stacks.calm = calm - 1;
    emit(battle, '定心抵挡住了惊扰。', { kind: 'buff' });
    return false;
  }
  emit(battle, '你心神被惊扰，这回合的行动被打断了！', { kind: 'info' });
  return true;
}

// 攻击是否落在幻象上
function ruleMiss(battle, actor) {
  if (!active(battle) || battle.rule !== 'illusion' || actor !== battle.player) return false;
  if (!battle.rng.chance(0.35)) return false;
  emit(battle, '你的攻击落在了幻象上，毫无效果！', { kind: 'info' });
  return true;
}

// 使用丹药后
function ruleOnItem(battle, actor) {
  if (!active(battle) || battle.rule !== 'shock' || actor !== battle.player) return;
  if (!actor.flags.stacks) actor.flags.stacks = {};
  actor.flags.stacks.calm = (actor.flags.stacks.calm || 0) + 2;
  emit(battle, '心神安定下来（定心 +2）。', { kind: 'buff' });
}

// 天道第二阶段起，五行克制失效
function ruleNeutralElements(battle) {
  return active(battle) && battle.rule === 'tiandao' && (battle.enemy.flags.phase || 1) >= 2;
}

return { RULE_INFO, initRule, ruleTurnStart, ruleTurnEnd, ruleInterrupt, ruleMiss, ruleOnItem, ruleNeutralElements };
},
"combat/autoplay.js": function () {
const { SKILLS } = __req("data/skills.js");
const { canAfford } = __req("combat/skills.js");

// 敌人 AI：有灵力时 70% 概率施展功法，否则普攻
function chooseEnemyAction(battle) {
  const enemy = battle.enemy;
  const options = enemy.skills.filter((id) => canAfford(enemy, id));
  if (options.length && battle.rng.chance(0.7)) {
    return { type: 'skill', skillId: battle.rng.pick(options) };
  }
  return { type: 'attack' };
}

// 辅助功法是否值得现在释放，避免自动战斗白白浪费回合
function isUseful(unit, skill) {
  if (skill.power > 0) return true;
  return (skill.then || []).some((t) => {
    const op = t.do.op;
    if (op === 'heal') return unit.hp / unit.stats.maxHp < 0.7;
    if (op === 'shield') return unit.shield <= 0;
    if (op === 'buff') return !unit.statuses.some((s) => s.id === 'buff' && s.stat === t.do.stat);
    if (op === 'mp') return unit.mp / unit.stats.maxMp < 0.5; // 回灵武学只在灵力不足一半时使用
    return true;
  });
}

// 自动战斗：config = { skillOrder:[功法id], pillHpThreshold }
function chooseAutoAction(battle, config = {}) {
  const cfg = { skillOrder: [], pillHpThreshold: 0.3, ...config };
  const p = battle.player;
  if (p.hp / p.stats.maxHp < cfg.pillHpThreshold && (p.items.hp_pill || 0) > 0) {
    return { type: 'item', itemId: 'hp_pill' };
  }
  const order = cfg.skillOrder.length
    ? cfg.skillOrder
    : p.skills.slice().sort((a, b) => SKILLS[b].power - SKILLS[a].power);
  for (const id of order) {
    if (!p.skills.includes(id)) continue;
    const skill = SKILLS[id];
    if (canAfford(p, id) && isUseful(p, skill)) return { type: 'skill', skillId: id };
  }
  return { type: 'attack' };
}

return { chooseEnemyAction, chooseAutoAction };
},
"ui/dom.js": function () {
// 极简 DOM 辅助：h('div', {class:'x', onclick:fn}, 子节点...)
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'disabled') el.disabled = true;
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}

function mount(root, node) {
  root.replaceChildren(node);
}

return { h, mount };
},

      h('p', { class: 'muted' }, `可以选一件装备作为「传承」带去下一世：属性按炼气期重新折算，词条保留，每传承一次再 +${Math.round(HEIRLOOM_BONUS * 100)}%。不选也行。`),
      cands.length
        ? h('div', { class: 'heir-list' }, cands.slice(0, 30).map(({ item, where }) => h('div', { class: `item-row rar-${item.rarity}` },
          h('div', { class: 'item-info' }, h('b', null, itemName(item), where === 'worn' ? h('span', { class: 'tag' }, '穿着') : null, item.gen ? h('span', { class: 'tag good' }, `传承 ${item.gen}`) : null), h('div', { class: 'muted' }, equipLine(item))),
          h('button', { class: `seal small ${d.pick === item.uid ? 'on' : ''}`, 'aria-pressed': String(d.pick === item.uid), onclick: () => a.pickHeirloom(item.uid) }, d.pick === item.uid ? '已选' : '传承'))))
        : h('p', { class: 'muted' }, '你身上没有装备。'),
      h('div', { class: 'btns' },
        h('button', { class: 'seal', onclick: a.closeDialog }, '再想想'),
        h('button', { class: 'seal primary', onclick: a.confirmRebirth }, d.pick ? '带着传承转世' : '直接转世')),
    ];
  } else if (d.type === 'codex') {
    const st = metaStats(app.save.meta);
    const all = Object.values(MONSTERS);
    const seen = all.filter((m) => (st.monsters[m.id] || 0) > 0).length;
    body = [
      h('h2', null, `图鉴 ${seen}/${all.length}`),
      h('p', { class: 'muted' }, `累计击败 ${st.kills.toLocaleString('en-US')} 只，最远到第 ${(st.best || 0).toLocaleString('en-US')} 层。击败过的敌人才会显示出来。`),
      h('div', { class: 'codex-grid' }, all.map((m) => {
        const n = st.monsters[m.id] || 0;
        const src = portraitSrc({ id: m.id });
        return h('div', { class: `codex-card${n ? '' : ' unseen'}${m.human ? ' human' : ''}` },
          h('div', { class: `codex-face${src && portraitFull({ id: m.id }) ? ' full' : ''}` }, src ? h('img', { src, alt: '', draggable: 'false' }) : m.icon),
          h('div', { class: 'codex-name' }, n ? m.name : '？？？', n && m.human ? h('span', { class: 'tag bad' }, '魔修') : null),
          h('div', { class: 'muted' }, n ? `击败 ${n.toLocaleString('en-US')}` : '未见'));
      })),
      h('div', { class: 'btns' }, h('button', { class: 'seal primary', onclick: a.closeDialog }, '关闭')),
    ];
  } else if (d.type === 'achievements') {
    const got = app.save.meta.achievements || [];
    const groups = [...new Set(ACHIEVEMENTS.map((x) => x.group))];
    body = [
      h('h2', null, `成就 ${got.length}/${ACHIEVEMENTS.length}`),
      h('p', { class: 'muted' }, '达成成就立刻获得道果，可以在「道果加持」里使用。'),
      groups.map((g) => [h('h3', null, g), ACHIEVEMENTS.filter((x) => x.group === g).map((x) => {
        const done = got.includes(x.id);
        return h('div', { class: `item-row${done ? '' : ' sold'}` },
          h('div', { class: 'item-info' }, h('b', null, `${done ? '🏆' : '🔒'} ${x.name}`), h('div', { class: 'muted' }, x.desc)),
          h('span', { class: done ? 'gold' : 'muted' }, `道果 +${x.dao}`));
      })]),
      h('div', { class: 'btns' }, h('button', { class: 'seal primary', onclick: a.closeDialog }, '关闭')),
    ];
  } else if (d.type === 'menu') {
    body = [
      h('h2', null, '菜单'),
      h('div', { class: 'menu-list' },
        h('button', { class: 'seal', onclick: a.openHelp }, '玩法说明'),
        h('button', { class: 'seal', onclick: a.openAbout }, '关于 / 作者名单'),
        h('button', { class: 'seal', onclick: a.openExport }, '导出存档码'),
        h('button', { class: 'seal', onclick: a.openImport }, '导入存档码'),
        h('button', { class: 'seal', onclick: a.openAchievements }, `成就 ${(app.save.meta.achievements || []).length}/${ACHIEVEMENTS.length}`),
        h('button', { class: 'seal', onclick: a.openCodex }, '图鉴'),
        h('button', { class: 'seal', onclick: a.openDao }, '道果加持'),
        h('button', { class: `seal ${app.save.meta.settings.caveAuto ? 'on' : ''}`, 'aria-pressed': String(!!app.save.meta.settings.caveAuto), onclick: () => a.toggleSetting('caveAuto') }, `自动历练遇到洞府：${app.save.meta.settings.caveAuto ? '自动选稳妥' : '暂停让我选'}`),
        app.save.run && app.save.run.demon.won ? h('button', { class: 'seal', onclick: a.rebirth }, '轮回转世') : null,
        app.save.run ? h('button', { class: 'seal', onclick: a.abandon }, '放弃本次修行') : null,
        h('button', { class: 'seal primary', onclick: a.closeDialog }, '关闭')),
    ];
  } else if (d.type === 'export') {
    body = [
      h('h2', null, '导出存档码'),
      h('p', { class: 'muted', style: 'margin-bottom:8px' }, '复制下面的存档码，换设备或清缓存后可用「导入」恢复。'),

      h('div', { class: 'btns' },
        h('button', { class: 'seal primary', onclick: a.copyCode }, '复制'),
        h('button', { class: 'seal', onclick: a.closeDialog }, '关闭')),
    ];
  } else {
    body = [
      h('h2', null, '导入存档码'),
      h('p', { class: 'muted', style: 'margin-bottom:8px' }, '导入会覆盖当前进度。'),
      h('textarea', {
        class: 'code', 'aria-label': '存档码', placeholder: '粘贴以 XT1. 开头的存档码',
        oninput: (e) => { d.text = e.target.value; },
      }, d.text || ''),
      d.error ? h('p', { class: 'error', role: 'alert', style: 'margin-top:6px' }, d.error) : null,
      h('div', { class: 'btns' },
        h('button', { class: 'seal primary', onclick: a.doImport }, '导入'),
        h('button', { class: 'seal', onclick: a.closeDialog }, '取消')),

  return h('div', { class: 'modal', onclick: (e) => { if (e.target === e.currentTarget) a.closeDialog(); } },
